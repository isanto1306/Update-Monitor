name: Patch GitHub info link once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-github-link-once.yml'

permissions:
  contents: write

jobs:
  patch-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Link GitHub icon to Update Monitor repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<span class="system-info-support-link system-info-github-link" role="img" aria-label="GitHub" title="GitHub" style="cursor:default">'
          new = '''<a
                          class="system-info-support-link system-info-github-link"
                          href="https://github.com/isanto1306/Update-Monitor"
                          target="_blank"
                          rel="noopener noreferrer"
                          aria-label="Update Monitor auf GitHub öffnen"
                          title="GitHub"
                      >'''

          if old not in text:
              raise SystemExit('Expected GitHub icon placeholder was not found; nothing changed.')

          start = text.index(old)
          text = text[:start] + new + text[start + len(old):]

          close = '</svg></span>'
          close_pos = text.find(close, start)
          if close_pos < 0:
              raise SystemExit('Expected GitHub icon closing tag was not found.')
          text = text[:close_pos] + '</svg></a>' + text[close_pos + len(close):]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Link GitHub icon to Update Monitor repository"
          git push
