name: Inspect v0.3.348 targets

on:
  push:
    branches:
      - fix-v0.3.348
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v0.3.348
      - name: Show backend and frontend version display paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename, needles in {
            'app/main.py': [
              'zima_title_catalog = casaos_title_catalog()',
              'entry = deployments.setdefault(key, {',
              'def build_apps',
              '"installed_version"',
              'display_installed_version',
            ],
            'static/index.html': [
              'display_installed_version',
              'resolved_installed_tag',
              'installed_version',
              'versionPicker',
              'versionLoad',
              'Version konnte',
            ],
          }.items():
            lines=Path(filename).read_text(encoding='utf-8').splitlines()
            print('\n########', filename, '########')
            seen=set()
            for needle in needles:
              print('\n===', needle, '===')
              count=0
              for i,line in enumerate(lines,1):
                if needle in line:
                  a=max(1,i-22); b=min(len(lines),i+70)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  print(f'--- {a}:{b} ---')
                  for n in range(a,b+1): print(f'{n}: {lines[n-1]}')
                  count+=1
                  if count>=3: break
          PY
