name: Inspect v0.3.348 targets

on:
  push:
    branches:
      - fix-v0.3.348
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v0.3.348
      - name: Show target code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=[
            'available_version_tags',
            'newer_tags',
            'def _version_alias',
            'def _version_item_current_tag',
            'def registry_tag',
            'def fetch_registry',
            'github_latest_version',
            'resolved_installed_tag',
          ]
          seen=set()
          for needle in needles:
            print('\n===', needle, '===')
            count=0
            for i,line in enumerate(lines,1):
              if needle in line:
                a=max(1,i-18); b=min(len(lines),i+55)
                key=(a,b)
                if key in seen: continue
                seen.add(key)
                print(f'--- {a}:{b} ---')
                for n in range(a,b+1): print(f'{n}: {lines[n-1]}')
                count+=1
                if count>=4: break
          PY
