name: Inspect v0.3.348 targets

on:
  push:
    branches:
      - fix-v0.3.348
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v0.3.348
      - name: Show target code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=[
            'def zimaos_managed_latest_digest_ref',
            'def build_version_groups',
            'def list_registry_tags',
            'def available_versions',
            'sha-',
            'No selectable version group is available',
          ]
          for needle in needles:
            print('\n===', needle, '===')
            for i,line in enumerate(lines,1):
              if needle in line:
                a=max(1,i-20); b=min(len(lines),i+80)
                print(f'--- {a}:{b} ---')
                for n in range(a,b+1): print(f'{n}: {lines[n-1]}')
                break
          PY
