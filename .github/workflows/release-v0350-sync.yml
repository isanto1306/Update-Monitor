name: Prepare v0.3.350

on:
  push:
    branches:
      - publish-semver-v0.3.350

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-semver-v0.3.350
          fetch-depth: 0

      - name: Synchronize active release markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('app/main.py', 'VERSION = "0.3.349"', 'VERSION = "0.3.350"')
          replace_exact('README.md', 'Current release: **v0.3.349**', 'Current release: **v0.3.350**')
          replace_exact('docker-compose.zimaos.yml', 'version: "0.3.349"', 'version: "0.3.350"')
          replace_exact('translation-audit-current.json', '"version": "v0.3.349"', '"version": "v0.3.350"')

          manifest = Path('static/site.webmanifest')
          mt = manifest.read_text(encoding='utf-8')
          count = mt.count('?v=0.3.349')
          if count != 2:
              raise SystemExit(f'static/site.webmanifest: expected 2 cache markers, found {count}')
          manifest.write_text(mt.replace('?v=0.3.349', '?v=0.3.350'), encoding='utf-8')

          html = Path('static/index.html')
          ht = html.read_text(encoding='utf-8')
          cache_count = ht.count('?v=0.3.349')
          if cache_count < 1:
              raise SystemExit('static/index.html: current cache marker missing')
          ht = ht.replace('?v=0.3.349', '?v=0.3.350')
          old_visible = 'id="systemInfoVersion">v0.3.349'
          if ht.count(old_visible) != 1:
              raise SystemExit('static/index.html: visible system version marker mismatch')
          ht = ht.replace(old_visible, 'id="systemInfoVersion">v0.3.350', 1)
          old_const = "const UPDATE_MONITOR_VERSION = 'v0.3.349';"
          if ht.count(old_const) != 1:
              raise SystemExit('static/index.html: frontend version constant mismatch')
          ht = ht.replace(old_const, "const UPDATE_MONITOR_VERSION = 'v0.3.350';", 1)
          html.write_text(ht, encoding='utf-8')
          PY

      - name: Validate release and publish workflow
        run: |
          python3 -m py_compile app/main.py
          python3 - <<'PY'
          from pathlib import Path
          assert 'VERSION = "0.3.350"' in Path('app/main.py').read_text(encoding='utf-8')
          assert 'Current release: **v0.3.350**' in Path('README.md').read_text(encoding='utf-8')
          assert 'version: "0.3.350"' in Path('docker-compose.zimaos.yml').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert 'id="systemInfoVersion">v0.3.350' in html
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.350';" in html
          wf = Path('.github/workflows/publish-ghcr.yml').read_text(encoding='utf-8')
          assert 'id: app_version' in wf
          assert 'app_version.outputs.version' in wf
          assert "- 'README.md'" in wf
          assert "- 'docs/**'" in wf
          print('v0.3.350 release validation OK')
          PY
          git diff --check

      - name: Commit synchronized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py README.md docker-compose.zimaos.yml static/index.html static/site.webmanifest translation-audit-current.json
          git commit -m "Synchronize v0.3.350 release markers"
          git push origin publish-semver-v0.3.350
