name: Improve project link discovery once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-project-link-discovery-once.yml'

permissions:
  contents: write

jobs:
  patch-project-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add verified forge fallback and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          text = main_path.read_text(encoding='utf-8')

          old_version = 'VERSION = "0.3.316"'
          new_version = 'VERSION = "0.3.319"'
          if old_version not in text:
              raise SystemExit('Expected backend version marker was not found.')
          text = text.replace(old_version, new_version, 1)

          marker = 'def docker_hub_project_link(image_ref):\n'
          if marker not in text:
              raise SystemExit('docker_hub_project_link marker was not found.')

          helper = r'''DOCKER_HUB_REGISTRY_PREFIXES = (
    "docker.io/",
    "index.docker.io/",
    "registry-1.docker.io/",
)
PROJECT_FORGE_COMPONENT_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$")


def docker_hub_owner_repo(image_ref):
    """Return an exact Docker Hub owner/repository pair when it is safe to infer."""
    value = str(image_ref or "").strip()
    if not value:
        return None

    # A digest never changes the repository identity.
    value = value.split("@", 1)[0].strip()
    lowered = value.lower()
    for prefix in DOCKER_HUB_REGISTRY_PREFIXES:
        if lowered.startswith(prefix):
            value = value[len(prefix):]
            lowered = value.lower()
            break

    # Do not reinterpret an explicitly named non-Docker-Hub registry as an
    # owner.  This keeps the fallback conservative and avoids wrong links.
    first = value.split("/", 1)[0]
    if "." in first or ":" in first or first.lower() == "localhost":
        return None

    parts = [part for part in value.split("/") if part]
    if len(parts) != 2:
        return None

    owner, repo = parts
    if ":" in repo:
        repo = repo.rsplit(":", 1)[0]

    if not owner or not repo:
        return None
    if not PROJECT_FORGE_COMPONENT_RE.fullmatch(owner):
        return None
    if not PROJECT_FORGE_COMPONENT_RE.fullmatch(repo):
        return None
    return owner, repo


def _forge_repository_exists(api_url, *, github=False):
    """Probe one fixed public forge API. Never follows a user supplied host."""
    headers = {
        "User-Agent": "Update-Monitor/project-link-discovery",
        "Accept": "application/json",
    }
    if github:
        headers["Accept"] = "application/vnd.github+json"
        try:
            token, _source = active_github_token()
        except Exception:
            token = ""
        if token:
            headers["Authorization"] = f"Bearer {token}"

    request = urllib.request.Request(api_url, headers=headers, method="GET")
    try:
        with urllib.request.urlopen(request, timeout=4) as response:
            return 200 <= int(getattr(response, "status", 200)) < 300
    except urllib.error.HTTPError as exc:
        # 404 means the repository is definitely absent.  Other HTTP errors
        # (rate limiting, transient forge errors) are treated as no verified
        # result so Update Monitor never invents a link.
        return False
    except Exception:
        return False


def verified_forge_project_link(image_ref):
    """
    Last-resort source discovery for Docker Hub images that expose no usable
    OCI labels and no project URL in registry metadata.

    Only an exact owner/repository pair is considered. GitHub, GitLab and
    Codeberg are queried concurrently, and a link is returned only after the
    corresponding repository API confirms that it exists. Preference order is
    GitHub, then GitLab, then Codeberg when more than one exact match exists.
    """
    owner_repo = docker_hub_owner_repo(image_ref)
    if not owner_repo:
        return None

    owner, repo = owner_repo
    encoded_path = urllib.parse.quote(f"{owner}/{repo}", safe="")
    probes = [
        (
            "github",
            f"https://api.github.com/repos/{urllib.parse.quote(owner, safe='')}/{urllib.parse.quote(repo, safe='')}",
            f"https://github.com/{owner}/{repo}",
            True,
        ),
        (
            "gitlab",
            f"https://gitlab.com/api/v4/projects/{encoded_path}",
            f"https://gitlab.com/{owner}/{repo}",
            False,
        ),
        (
            "codeberg",
            f"https://codeberg.org/api/v1/repos/{urllib.parse.quote(owner, safe='')}/{urllib.parse.quote(repo, safe='')}",
            f"https://codeberg.org/{owner}/{repo}",
            False,
        ),
    ]

    with concurrent.futures.ThreadPoolExecutor(max_workers=len(probes)) as pool:
        futures = {
            provider: pool.submit(_forge_repository_exists, api_url, github=is_github)
            for provider, api_url, _project_url, is_github in probes
        }
        for provider, _api_url, project_url, _is_github in probes:
            try:
                exists = bool(futures[provider].result(timeout=5))
            except Exception:
                exists = False
            if exists:
                return {
                    "url": project_url,
                    "provider": provider,
                    "source": f"forge-probe:{provider}",
                }

    return None


'''
          if 'def verified_forge_project_link(image_ref):' in text:
              raise SystemExit('Verified forge fallback already exists.')
          text = text.replace(marker, helper + marker, 1)

          old_resolver = '''    registry = docker_hub_project_link(image_ref)\n    if registry and registry.get("url"):\n        return project_link_cache_put(\n            image_ref,\n            url=registry.get("url"),\n            provider=registry.get("provider"),\n            source=registry.get("source"),\n        )\n\n    # Preserve a previously known positive link if a later revalidation cannot\n'''
          new_resolver = '''    registry = docker_hub_project_link(image_ref)\n    if registry and registry.get("url"):\n        return project_link_cache_put(\n            image_ref,\n            url=registry.get("url"),\n            provider=registry.get("provider"),\n            source=registry.get("source"),\n        )\n\n    verified_forge = verified_forge_project_link(image_ref)\n    if verified_forge and verified_forge.get("url"):\n        return project_link_cache_put(\n            image_ref,\n            url=verified_forge.get("url"),\n            provider=verified_forge.get("provider"),\n            source=verified_forge.get("source"),\n        )\n\n    # Preserve a previously known positive link if a later revalidation cannot\n'''
          if old_resolver not in text:
              raise SystemExit('Expected project-link resolver block was not found.')
          text = text.replace(old_resolver, new_resolver, 1)
          main_path.write_text(text, encoding='utf-8')

          index_path = Path('static/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_frontend = "const UPDATE_MONITOR_VERSION = 'v0.3.318';"
          new_frontend = "const UPDATE_MONITOR_VERSION = 'v0.3.319';"
          if old_frontend not in index:
              raise SystemExit('Expected frontend version marker was not found.')
          index_path.write_text(index.replace(old_frontend, new_frontend, 1), encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app/main.py

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve project link discovery and bump v0.3.319"
          git push
