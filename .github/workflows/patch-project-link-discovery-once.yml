name: Improve project link discovery once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-project-link-discovery-once.yml'

permissions:
  contents: write

jobs:
  patch-project-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add verified forge fallback and bump version
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          main_path = Path('app/main.py')
          text = main_path.read_text(encoding='utf-8')
          old_version = 'VERSION = "0.3.316"'
          new_version = 'VERSION = "0.3.319"'
          if old_version not in text:
              raise SystemExit('Expected backend version marker was not found.')
          text = text.replace(old_version, new_version, 1)
          marker = 'def docker_hub_project_link(image_ref):\n'
          if marker not in text:
              raise SystemExit('docker_hub_project_link marker was not found.')
          helper = base64.b64decode('').decode('utf-8')
          if 'def verified_forge_project_link(image_ref):' in text:
              raise SystemExit('Verified forge fallback already exists.')
          text = text.replace(marker, helper + marker, 1)
          old_resolver = base64.b64decode('').decode('utf-8')
          new_resolver = base64.b64decode('').decode('utf-8')
          if old_resolver not in text:
              raise SystemExit('Expected project-link resolver block was not found.')
          text = text.replace(old_resolver, new_resolver, 1)
          main_path.write_text(text, encoding='utf-8')
          index_path = Path('static/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_frontend = "const UPDATE_MONITOR_VERSION = 'v0.3.318';"
          new_frontend = "const UPDATE_MONITOR_VERSION = 'v0.3.319';"
          if old_frontend not in index:
              raise SystemExit('Expected frontend version marker was not found.')
          index_path.write_text(index.replace(old_frontend, new_frontend, 1), encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app/main.py

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve project link discovery and bump v0.3.319"
          git push
