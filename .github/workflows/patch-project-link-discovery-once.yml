name: Refresh legacy negative project link cache once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-project-link-discovery-once.yml'

permissions:
  contents: write

jobs:
  patch-project-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh old negative cache entries for new discovery logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          old = '    cached = project_link_cache_get(image_ref)\n    if cached and project_link_cache_is_fresh(cached):\n        return cached\n'
          new = '    cached = project_link_cache_get(image_ref)\n    if cached and project_link_cache_is_fresh(cached):\n        # Positive entries remain authoritative. Negative entries created by\n        # older Update Monitor versions are intentionally rechecked once so\n        # the verified forge fallback can discover links that were previously\n        # unavailable. Current-generation negative results keep the normal TTL.\n        if cached.get("url") or str(cached.get("source") or "") == "not-found:v2":\n            return cached\n'
          if old not in text:
              raise SystemExit('Expected fresh-cache block was not found.')
          text = text.replace(old, new, 1)
          old_final = '        source="not-found",\n    )\n\n\ndef _remote_digest_error_is_transient(message):'
          new_final = '        source="not-found:v2",\n    )\n\n\ndef _remote_digest_error_is_transient(message):'
          if old_final not in text:
              raise SystemExit('Expected negative-cache marker was not found.')
          text = text.replace(old_final, new_final, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app/main.py

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Refresh legacy negative project link cache"
          git push
