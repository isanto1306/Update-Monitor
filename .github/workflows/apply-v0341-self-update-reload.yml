name: Apply v0.3.341 self update reload fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0341-self-update-reload.yml'
      - '.github/patch_v0341.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate patch
        run: python .github/patch_v0341.py

      - name: Commit fixed sources
        run: |
          rm -f .github/workflows/apply-v0341-self-update-reload.yml .github/patch_v0341.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py static/index.html .github/workflows/apply-v0341-self-update-reload.yml .github/patch_v0341.py
          git commit -m 'Fix self update browser reload v0.3.341'
          git push origin main
