name: Apply verified translation update v0.3.323

on:
  push:
    paths:
      - '.github/workflows/temp-export-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patcher
        shell: bash
        run: |
          cat .github/tmp/patcher323.part1 .github/tmp/patcher323.part2 .github/tmp/patcher323.part3 .github/tmp/patcher323.part4 > /tmp/patcher323.b64
          printf '%s  %s\n' '1ddb72a3f84f01ec10a26923e19e99a9d1e39c0477ca0982053d79a28e996c63' '/tmp/patcher323.b64' | sha256sum -c -
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(Path('/tmp/patcher323.b64').read_bytes()))
          expected = '58a5ef3d6566b6aa8a855e6e12f7a5b50f7d51b6e8df28a3d88a884f65fa7d82'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'patcher SHA mismatch: {actual}')
          Path('/tmp/apply_translation_323.py').write_bytes(raw)
          PY
      - name: Include translation keys added after v0.3.291
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, re, zlib
          from pathlib import Path
          path = Path('/tmp/apply_translation_323.py')
          text = path.read_text(encoding='utf-8')
          match = re.search(r"_PAYLOAD_B64 = '([^']+)'", text)
          if not match:
              raise SystemExit('embedded translation payload not found')
          payload = json.loads(zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8'))
          new_keys = [
              'backupPhaseProgress','backupQuickUnsafe','backupRestoreProgress','checkDocker','checkDockerFailed',
              'checkingDocker','restoreVerificationPhase','runtimeCompleted','runtimeMixedCompleted','runtimeRunningCompleted'
          ]
          payload['expected_current_base_keys'] = sorted(set(payload['expected_current_base_keys']) | set(new_keys))
          additions = {
              'fr': {
                  'backupPhaseProgress':'SAUVEGARDE {progress} %',
                  'backupQuickUnsafe':'Non sûr pour revenir à une version antérieure : les données AppData n’ont pas été sauvegardées.',
                  'backupRestoreProgress':'RESTAURATION {progress} %',
                  'checkDocker':'VÉRIFIER DOCKER',
                  'checkDockerFailed':'Échec de la vérification Docker : {error}',
                  'checkingDocker':'VÉRIFICATION…',
                  'restoreVerificationPhase':'VÉRIFICATION DE L’APP…',
                  'runtimeCompleted':'Terminé',
                  'runtimeMixedCompleted':'{running}/{total} actifs · {completed} terminés',
                  'runtimeRunningCompleted':'{running} actifs · {completed} terminés'
              },
              'pt': {
                  'backupPhaseProgress':'BACKUP {progress} %',
                  'backupQuickUnsafe':'Não é seguro para regressão de versão: o AppData não foi incluído na cópia de segurança.',
                  'backupRestoreProgress':'RESTAURO {progress} %',
                  'checkDocker':'VERIFICAR DOCKER',
                  'checkDockerFailed':'Falha na verificação do Docker: {error}',
                  'checkingDocker':'A VERIFICAR…',
                  'restoreVerificationPhase':'APP A SER VERIFICADA…',
                  'runtimeCompleted':'Concluído',
                  'runtimeMixedCompleted':'{running}/{total} ativos · {completed} concluídos',
                  'runtimeRunningCompleted':'{running} ativos · {completed} concluídos'
              },
              'es': {
                  'backupPhaseProgress':'COPIA DE SEGURIDAD {progress} %',
                  'backupQuickUnsafe':'No es seguro volver a una versión anterior: AppData no se incluyó en la copia de seguridad.',
                  'backupRestoreProgress':'RESTAURACIÓN {progress} %',
                  'checkDocker':'COMPROBAR DOCKER',
                  'checkDockerFailed':'Error al comprobar Docker: {error}',
                  'checkingDocker':'COMPROBANDO…',
                  'restoreVerificationPhase':'COMPROBANDO LA APP…',
                  'runtimeCompleted':'Completado',
                  'runtimeMixedCompleted':'{running}/{total} activos · {completed} completados',
                  'runtimeRunningCompleted':'{running} activos · {completed} completados'
              }
          }
          for language, values in additions.items():
              payload[language].update(values)
          encoded = base64.b64encode(zlib.compress(json.dumps(payload, ensure_ascii=False, separators=(',',':')).encode('utf-8'), 9)).decode('ascii')
          text = text[:match.start(1)] + encoded + text[match.end(1):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply and validate translations
        shell: bash
        run: |
          python /tmp/apply_translation_323.py
      - name: Commit verified frontend
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/index.html translation-audit-final.json
          git commit -m 'Add French Portuguese and Spanish UI translations v0.3.323'
          git push
