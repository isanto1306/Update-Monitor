name: Apply verified translation update v0.3.323

on:
  push:
    paths:
      - '.github/workflows/temp-export-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patcher
        shell: bash
        run: |
          cat .github/tmp/patcher323.part1 .github/tmp/patcher323.part2 .github/tmp/patcher323.part3 .github/tmp/patcher323.part4 > /tmp/patcher323.b64
          printf '%s  %s\n' '1ddb72a3f84f01ec10a26923e19e99a9d1e39c0477ca0982053d79a28e996c63' '/tmp/patcher323.b64' | sha256sum -c -
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(Path('/tmp/patcher323.b64').read_bytes()))
          expected = '58a5ef3d6566b6aa8a855e6e12f7a5b50f7d51b6e8df28a3d88a884f65fa7d82'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'patcher SHA mismatch: {actual}')
          Path('/tmp/apply_translation_323.py').write_bytes(raw)
          PY
      - name: Apply and validate translations
        shell: bash
        run: |
          python /tmp/apply_translation_323.py
      - name: Commit verified frontend
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/index.html translation-audit-final.json
          git commit -m 'Add French Portuguese and Spanish UI translations v0.3.323'
          git push
