name: One-time v0.3.384 synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0384.yml

permissions:
  contents: write

jobs:
  synchronize-v0384:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump release markers to v0.3.384
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected marker in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('app/main.py', 'VERSION = "0.3.383"', 'VERSION = "0.3.384"')
          replace_exact('docker-compose.zimaos.yml', '  version: "0.3.383"', '  version: "0.3.384"')
          replace_exact('static/site.webmanifest', '?v=0.3.383', '?v=0.3.384')
          replace_exact('static/update-channel.js', 'um-update-channel-v0383', 'um-update-channel-v0384')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.383', '/update-channel.js?v=0.3.384')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.384-controls1', '/update-channel.js?v=0.3.384-typography1')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Current release: **v0.3.383**', 'Current release: **v0.3.384**', 1)
          marker = 'v0.3.383 refines the Manual percentage control inside the full-width Display selector.'
          if marker not in text:
              raise SystemExit('README v0.3.383 marker missing')
          entry = (
              'v0.3.384 aligns the Manual percentage typography with the existing Time format selector. '
              'The percentage value and percent sign now inherit the same font family, size and weight as values such as 24 hours, while the permanent up/down controls, full-width Display selector and 40 px card safety boundary remain unchanged.\n\n'
          )
          text = text.replace(marker, entry + marker, 1)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.384 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          js = Path('static/layout-options.js').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert 'um-card-scale-options-v10' in js
          assert 'SAFE_EDGE_PX=40' in js
          assert 'font:inherit;font-size:inherit;font-weight:inherit' in js
          assert 'font-size:15px' not in js
          assert 'font-weight:700' not in js
          assert 'um-card-custom-spinner' in js
          assert 'gridLayoutCustomIncrease' in js
          assert 'gridLayoutCustomDecrease' in js
          assert "if(mode==='auto')return ''" in js
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.384';" in html
          assert 'id="systemInfoVersion">v0.3.384</div>' in html
          PY

      - name: Commit synchronized v0.3.384
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.384 matching manual typography"
          git push
