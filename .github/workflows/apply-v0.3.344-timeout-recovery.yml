name: Apply Update Monitor v0.3.344 timeout recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.3.344-timeout-recovery.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and validate v0.3.344
        run: python .github/patch-v0.3.344.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- static/index.html app/main.py docker-compose.zimaos.yml README.md

      - name: Commit v0.3.344
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch-v0.3.344.py .github/workflows/apply-v0.3.344-timeout-recovery.yml
          git add static/index.html app/main.py docker-compose.zimaos.yml README.md .github/patch-v0.3.344.py .github/workflows/apply-v0.3.344-timeout-recovery.yml
          git commit -m "Recover successful updates after gateway timeout v0.3.344"
          git push origin main
