name: Temporary browser startup diagnostic

on:
  push:
    paths:
      - '.github/workflows/temp-browser-smoke.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show failing source and verify applyLanguage IDs
        shell: bash
        run: |
          echo '=== FAILING SOURCE ==='
          nl -ba static/index.html | sed -n '18966,18980p'
          echo '=== APPLYLANGUAGE DOM ID CHECK ==='
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('static/index.html').read_text(encoding='utf-8')
          a=s.index('function applyLanguage(){')
          b=s.index('\n}',a)+2
          body=s[a:b]
          ids=re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)",body)
          html_ids=set(re.findall(r'id=["\']([^"\']+)["\']',s))
          print('applyLanguage refs:', len(ids))
          missing=[x for x in ids if x not in html_ids]
          print('missing:', missing)
          for x in missing:
              for i,line in enumerate(s.splitlines(),1):
                  if x in line:
                      print(i, line.strip())
          PY
