name: Apply and verify v0.3.324 startup fix

on:
  push:
    paths:
      - '.github/workflows/temp-browser-smoke.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair version element and bump frontend version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('static/index.html')
          s=p.read_text(encoding='utf-8')
          broken='\\1v0.3.323\\2'
          if s.count(broken)!=1:
              raise SystemExit(f'Expected exactly one broken version marker, found {s.count(broken)}')
          s=s.replace(broken,'<div class="system-info-value" id="systemInfoVersion">v0.3.324</div>',1)
          old="const UPDATE_MONITOR_VERSION = 'v0.3.323';"
          new="const UPDATE_MONITOR_VERSION = 'v0.3.324';"
          if s.count(old)!=1:
              raise SystemExit(f'Expected one frontend version constant, found {s.count(old)}')
          s=s.replace(old,new,1)
          s=s.replace('?v=0.3.323','?v=0.3.324')
          if broken in s:
              raise SystemExit('Broken version marker still present')
          if 'id="systemInfoVersion"' not in s:
              raise SystemExit('systemInfoVersion element is still missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate applyLanguage DOM references
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('static/index.html').read_text(encoding='utf-8')
          a=s.index('function applyLanguage(){')
          b=s.index('\n}',a)+2
          body=s[a:b]
          ids=re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)",body)
          html_ids=set(re.findall(r'id=["\']([^"\']+)["\']',s))
          missing=sorted(set(x for x in ids if x not in html_ids))
          print('applyLanguage refs:',len(ids))
          print('missing:',missing)
          if missing:
              raise SystemExit('Missing applyLanguage DOM IDs: '+', '.join(missing))
          if s.count('id="systemInfoVersion"')!=1:
              raise SystemExit('systemInfoVersion ID count is not exactly 1')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --directory static >/tmp/update-monitor-http.log 2>&1 &
      - name: Browser startup test in all languages
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const lang of ['de','en','fr','pt','es']){
              const page=await browser.newPage();
              const errors=[];
              page.on('pageerror',e=>{errors.push(String(e.stack||e)); console.log(`[${lang}] PAGEERROR`,String(e.stack||e));});
              page.on('console',m=>{if(m.type()==='error')console.log(`[${lang}] CONSOLE ERROR`,m.text());});
              await page.addInitScript(l=>localStorage.setItem('updateMonitorLanguage',l),lang);
              await page.route('**/api/auth/status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({authenticated:false})}));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(500);
              const state=await page.evaluate(()=>({
                lang:document.documentElement.lang,
                loginDisplay:getComputedStyle(document.getElementById('loginScreen')).display,
                versionEl:document.getElementById('systemInfoVersion')?.textContent||null,
                loginButton:document.getElementById('loginButton')?.textContent||null
              }));
              console.log(`[${lang}]`,JSON.stringify(state));
              if(errors.length)throw new Error(`${lang}: browser page errors: ${errors.join(' | ')}`);
              if(state.loginDisplay==='none')throw new Error(`${lang}: login screen is hidden`);
              if(state.lang!==lang)throw new Error(`${lang}: document language mismatch: ${state.lang}`);
              if(state.versionEl!=='v0.3.324')throw new Error(`${lang}: version element mismatch: ${state.versionEl}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/index.html
          git commit -m 'Fix startup crash and restore version element v0.3.324'
          git push
