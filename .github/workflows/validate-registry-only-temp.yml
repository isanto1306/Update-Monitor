name: Validate registry only branch

on:
  push:
    branches:
      - remove-webhook-automation-v0371

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend syntax
        run: python3 -m py_compile app/main.py

      - name: Synchronize frontend
        run: python3 .github/scripts/sync_frontend.py

      - name: Validate registry only state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          main = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          compose = Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")

          assert 'VERSION = "0.3.371"' in main
          assert "github_webhook_" not in main
          assert "/api/webhooks/" not in main
          assert "um-webhook-automation" not in html
          assert "Webhook Automatik" not in html
          assert "Current release: **v0.3.371**" in readme
          assert 'version: "0.3.371"' in compose
          assert "backupProgressVisuals" in html
          assert "smoothConfirmedBackupProgress" in html
          print("registry only validation passed")
          PY
