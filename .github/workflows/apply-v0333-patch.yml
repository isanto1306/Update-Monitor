name: Apply v0.3.333 source patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_v0333.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'resource_pattern.subn(resource_replacement, index, count=1)',
              'resource_pattern.subn(lambda _m: resource_replacement, index, count=1)',
          )
          text = text.replace(
              'style_pattern.subn(style_replacement, index, count=1)',
              'style_pattern.subn(lambda _m: style_replacement, index, count=1)',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/patch_v0333.py

      - name: Commit patched sources
        run: |
          if git diff --quiet static/index.html app/main.py; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html app/main.py
          git commit -m "Update Monitor v0.3.333 CPU RAM reference layout"
          git push origin HEAD:main
