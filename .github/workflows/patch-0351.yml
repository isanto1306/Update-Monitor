name: Patch Update Monitor 0.3.351

on:
  push:
    branches:
      - feature-update-channel-0351
    paths:
      - '.github/workflows/patch-0351.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply 0.3.351 release patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-update-channel-0351
          fetch-depth: 0

      - name: Patch main HTML and release markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old,new,1)

          p=Path("static/index.html")
          s=p.read_text(encoding="utf-8")
          dollar="$"

          s=once(
              s,
              "imageSourceText('Quelle wählen','Choose source')",
              "imageSourceText('Image Quelle wählen','Choose image source')",
              "Image Quelle button label",
          )
          old_detail=(
              dollar+"{details}"+
              dollar+"{renderImageSourceEntry(app)}"+
              dollar+"{renderBackupDetails(app)}"
          )
          new_detail=(
              dollar+"{details}"+
              dollar+"{renderUpdateChannelEntry(app)}"+
              dollar+"{renderImageSourceEntry(app)}"+
              dollar+"{renderBackupDetails(app)}"
          )
          s=once(s,old_detail,new_detail,"Update Kanal detail insertion")
          s=once(
              s,
              "<script>\\nconst UPDATE_MONITOR_VERSION = 'v0.3.350';",
              "<script src=\\"/update-channel.js?v=0.3.351\\"></script>\\n\\n<script>\\nconst UPDATE_MONITOR_VERSION = 'v0.3.351';",
              "Update Kanal module and frontend version",
          )
          s=s.replace("?v=0.3.350","?v=0.3.351")
          s=s.replace(">v0.3.350<",">v0.3.351<")
          p.write_text(s,encoding="utf-8")

          manifest=Path("static/site.webmanifest")
          m=manifest.read_text(encoding="utf-8").replace("?v=0.3.350","?v=0.3.351")
          manifest.write_text(m,encoding="utf-8")

          readme=Path("README.md")
          r=readme.read_text(encoding="utf-8")
          r=once(r,"Current release: **v0.3.350**","Current release: **v0.3.351**","README release")
          marker="Current release: **v0.3.351**\\n"
          note=(
              "\\nUpdate channels are now separated from concrete versions. "
              "Moving Docker tags such as latest, stable, next, lts or "
              "a major channel such as 2 can be selected directly from the "
              "application details with backup, Compose validation, verified "
              "pull and targeted post-change verification.\\n"
          )
          r=r.replace(marker,marker+note,1)
          readme.write_text(r,encoding="utf-8")

          compose=Path("docker-compose.zimaos.yml")
          c=compose.read_text(encoding="utf-8")
          c=once(c,'  version: "0.3.350"','  version: "0.3.351"',"Compose version")
          c=re.sub(r'(?m)^  update_at: "[^"]+"$','  update_at: "2026-09-19"',c,count=1)
          compose.write_text(c,encoding="utf-8")

          audit=Path("translation-audit-current.json")
          a=audit.read_text(encoding="utf-8")
          a=once(a,'"version": "v0.3.350"','"version": "v0.3.351"',"translation audit version")
          audit.write_text(a,encoding="utf-8")

          checks={
              "module reference": '/update-channel.js?v=0.3.351' in s,
              "channel detail": (dollar+"{renderUpdateChannelEntry(app)}") in s,
              "source label": "imageSourceText('Image Quelle wählen','Choose image source')" in s,
              "frontend version": "UPDATE_MONITOR_VERSION = 'v0.3.351'" in s,
              "manifest": "?v=0.3.351" in m,
              "README": "Current release: **v0.3.351**" in r,
              "Compose": 'version: "0.3.351"' in c,
              "audit": '"version": "v0.3.351"' in a,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("Release checks failed: "+", ".join(failed))

          leftovers=[]
          for path in ["static/index.html","static/site.webmanifest","README.md","docker-compose.zimaos.yml","translation-audit-current.json"]:
              data=Path(path).read_text(encoding="utf-8")
              for match in re.finditer("0.3.350",data):
                  leftovers.append((path,data[max(0,match.start()-90):match.end()+90].replace("\\n"," ")))
          if leftovers:
              print("Remaining 0.3.350 contexts (historical text may be valid):")
              for row in leftovers:
                  print(row)
          PY

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile and test backend
        shell: bash
        env:
          UPDATE_MONITOR_USERNAME: test
          UPDATE_MONITOR_PASSWORD: test-password-12345
          UPDATE_MONITOR_SESSION_SECRET: test-session-secret-123456789012345678901234567890
          UPDATE_MONITOR_CACHE_DIR: /tmp/update-monitor-test
          UPDATE_MONITOR_SCAN_ON_START: "false"
        run: |
          python3 -m py_compile app/main.py
          python3 - <<'PY'
          import app.main as m
          assert m.VERSION == "0.3.351"
          assert m._is_update_channel_tag("latest")
          assert m._is_update_channel_tag("2")
          assert m._is_update_channel_tag("next")
          assert not m._is_update_channel_tag("2.5.5")
          assert not m._is_update_channel_tag("sha-abcdef1")
          tags=["latest","2","next","2.5.5","2.5.4","sha-abcdef1","amd64-2.5.5"]
          channels=m.registry_update_channel_tags(tags,current_tag="latest")
          assert "latest" in channels and "2" in channels and "next" in channels
          assert "2.5.5" not in channels and "sha-abcdef1" not in channels
          versions=m.registry_selectable_version_tags(tags,repo_key="ghcr.io/test/app",current_tag="latest")
          assert "2.5.5" in versions and "2.5.4" in versions
          assert "latest" not in versions and "2" not in versions and "next" not in versions
          assert "sha-abcdef1" not in versions
          assert "update-channel.js" in m.WEB_ICON_ASSETS
          print("Backend Update Kanal regression checks OK")
          PY

      - name: Check frontend module and layout regression
        shell: bash
        run: |
          node --check static/update-channel.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("static/update-channel.js").read_text(encoding="utf-8")
          html=Path("static/index.html").read_text(encoding="utf-8")
          dollar="$"
          assert html.count('/update-channel.js?v=0.3.351') == 1
          assert html.count(dollar+"{renderUpdateChannelEntry(app)}") == 1
          assert "Image Quelle wählen" in html
          assert ".update-channel-entry{margin-top:10px;padding-top:10px;border-top:0;}" in js
          assert ".update-detail-image:has(+ .update-channel-entry){border-bottom:1px solid rgba(91,156,255,.42) !important;}" in js
          assert ".update-channel-entry + .image-source-entry{border-top:1px solid rgba(91,156,255,.42);}" in js
          assert ".update-channel-entry{margin-top:10px;padding-top:10px;border-top:1px" not in js
          assert "/api/image-channel-options" in js
          assert "/api/image-channel-switch" in js
          print("Frontend Update Kanal and single-line checks OK")
          PY

      - name: Version audit and diff check
        shell: bash
        run: |
          grep -n 'VERSION = "0.3.351"' app/main.py
          grep -n "UPDATE_MONITOR_VERSION = 'v0.3.351'" static/index.html
          grep -n 'version: "0.3.351"' docker-compose.zimaos.yml
          grep -n '"version": "v0.3.351"' translation-audit-current.json
          grep -n 'Current release: \*\*v0.3.351\*\*' README.md
          grep -n 'v=0.3.351' static/site.webmanifest
          git diff --check

      - name: Commit release implementation
        shell: bash
        run: |
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html static/site.webmanifest README.md docker-compose.zimaos.yml translation-audit-current.json
          git commit -m "Complete Update Kanal release v0.3.351"
          git push origin HEAD:feature-update-channel-0351
