name: Bump frontend version once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bump-frontend-version-once.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump Update Monitor frontend version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')
          old = "const UPDATE_MONITOR_VERSION = 'v0.3.316';"
          new = "const UPDATE_MONITOR_VERSION = 'v0.3.317';"
          if old not in text:
              raise SystemExit('Expected frontend version marker was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bump Update Monitor frontend to v0.3.317"
          git push
