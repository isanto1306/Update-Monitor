name: Apply v0.3.336 compact CPU RAM layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0336-resource-layout.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.3.336 resource layout patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          OLD_VERSION = '0.3.335'
          NEW_VERSION = '0.3.336'

          index_path = Path('static/index.html')
          main_path = Path('app/main.py')
          readme_path = Path('README.md')

          index = index_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          pattern = re.compile(r'<style id="um-card-resource-port-v0335">.*?</style>', re.S)
          match = pattern.search(index)
          if not match:
              raise SystemExit('v0.3.335 card resource style block not found')

          block = match.group(0)
          block = block.replace('id="um-card-resource-port-v0335"', 'id="um-card-resource-port-v0336"', 1)
          block = block.replace('/* v0.3.335 — final fixed card geometry based on the supplied reference. */',
                                '/* v0.3.336 — compact CPU/RAM rows; more width reserved for Port. */', 1)
          old_cols = 'grid-template-columns:minmax(86px,.92fr) minmax(144px,1.5fr) minmax(86px,.92fr) !important;'
          new_cols = 'grid-template-columns:minmax(86px,.92fr) minmax(118px,1.15fr) minmax(112px,1.08fr) !important;'
          if old_cols not in block:
              raise SystemExit('expected v0.3.335 three-column geometry not found')
          block = block.replace(old_cols, new_cols, 1)

          compact_css = r'''

          /* v0.3.336: the redundant CPU / RAM heading and chip are removed.
             CPU and RAM are already labelled on their own rows. The shorter
             tracks leave a wider, stable Port column for two-line port values. */
          .update-card-summary > .update-card-stats > .update-card-stat-resource{
            display:flex !important;
            flex-direction:column !important;
            align-items:center !important;
            justify-content:center !important;
            padding:8px 6px !important;
            overflow:visible !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat-resource::before{
            display:none !important;
            content:none !important;
          }
          .update-card-stat-resource .update-resource-title{
            display:none !important;
          }
          .update-card-stat-resource .update-resource-bars{
            width:103px !important;
            max-width:103px !important;
            min-width:103px !important;
            margin:0 auto !important;
            display:flex !important;
            flex-direction:column !important;
            gap:8px !important;
          }
          .update-card-stat-resource .update-resource-row{
            width:103px !important;
            max-width:103px !important;
            min-width:103px !important;
            display:grid !important;
            grid-template-columns:30px 68px !important;
            column-gap:5px !important;
            align-items:center !important;
            justify-content:center !important;
          }
          .update-card-stat-resource .update-resource-track{
            width:68px !important;
            min-width:68px !important;
            max-width:68px !important;
          }
          '''
          block = block.replace('</style>', compact_css + '\n</style>', 1)
          index = index[:match.start()] + block + index[match.end():]

          if OLD_VERSION not in index:
              raise SystemExit(f'{OLD_VERSION} not found in static/index.html')
          index = index.replace(OLD_VERSION, NEW_VERSION)

          old_main = f'VERSION = "{OLD_VERSION}"'
          new_main = f'VERSION = "{NEW_VERSION}"'
          if old_main not in main:
              raise SystemExit(f'{old_main} not found in app/main.py')
          main = main.replace(old_main, new_main, 1)

          old_readme = f'Current release: **v{OLD_VERSION}**'
          new_readme = f'Current release: **v{NEW_VERSION}**'
          if old_readme not in readme:
              raise SystemExit(f'{old_readme} not found in README.md')
          readme = readme.replace(old_readme, new_readme, 1)

          index_path.write_text(index, encoding='utf-8')
          main_path.write_text(main, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate sources
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          Path('/tmp/update-monitor.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          assert '0.3.336' in html
          assert 'um-card-resource-port-v0336' in html
          assert 'minmax(118px,1.15fr)' in html
          assert 'minmax(112px,1.08fr)' in html
          assert 'grid-template-columns:30px 68px' in html
          assert '.update-resource-title{\n            display:none !important;' in html
          PY
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit final sources
        shell: bash
        run: |
          rm -f .github/workflows/apply-v0336-resource-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Compact CPU RAM layout v0.3.336"
          git push origin HEAD:main
