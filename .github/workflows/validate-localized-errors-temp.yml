name: Validate localized backend errors branch

on:
  push:
    branches:
      - localize-backend-errors-v0372

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend syntax
        run: python3 -m py_compile app/main.py

      - name: Synchronize frontend
        run: python3 .github/scripts/sync_frontend.py

      - name: Validate localization bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          from pathlib import Path

          source = Path("app/main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          bridge = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(
                  isinstance(target, ast.Name)
                  and target.id == "_INDEX_ERROR_LOCALIZATION_BRIDGE"
                  for target in node.targets
              ):
                  bridge = ast.literal_eval(node.value)
                  break

          assert isinstance(bridge, str)
          assert 'um-error-localization-v0372' in bridge
          js = bridge.split(">", 1)[1].rsplit("</script>", 1)[0]
          prelude = """
          global.window=global;
          global.state={language:'de'};
          global.api=async function(){throw new Error('Wait until the current update check is finished');};
          """
          tests = """
          (async()=>{
            const de=window.updateMonitorLocalizeBackendMessage('Wait until the current update check is finished');
            if(de!=='Warte, bis die aktuelle Update Prüfung abgeschlossen ist.')throw new Error('German scan lock translation failed: '+de);

            const unknown=window.updateMonitorLocalizeBackendMessage('Completely unknown backend sentence');
            if(unknown!=='Technischer Fehler bei der angeforderten Aktion.')throw new Error('German generic fallback failed: '+unknown);

            let wrapped='';
            try{await api('/api/test');}catch(error){wrapped=String(error.message||'');}
            if(wrapped!=='Warte, bis die aktuelle Update Prüfung abgeschlossen ist.')throw new Error('API wrapper translation failed: '+wrapped);

            state.language='en';
            const en=window.updateMonitorLocalizeBackendMessage('Wait until the current update check is finished');
            if(en!=='Wait until the current update check is finished')throw new Error('English passthrough failed: '+en);
          })().catch(error=>{console.error(error);process.exit(1);});
          """
          Path("/tmp/um-error-localization-test.js").write_text(
              prelude + "\n" + js + "\n" + tests,
              encoding="utf-8",
          )
          PY
          node --check /tmp/um-error-localization-test.js
          node /tmp/um-error-localization-test.js

      - name: Validate translation parity and release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          audit = json.loads(Path("translation-audit-current.json").read_text(encoding="utf-8"))
          readme = Path("README.md").read_text(encoding="utf-8")
          compose = Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")

          assert 'VERSION = "0.3.372"' in main
          assert "um-error-localization-v0372" in html
          assert "updateMonitorLocalizeBackendMessage" in html
          assert "Warte, bis die aktuelle Update Prüfung abgeschlossen ist." in html
          assert "Technischer Fehler bei der angeforderten Aktion." in html
          assert audit.get("languages") == ["de", "en"]
          de = set((audit.get("translations") or {}).get("de") or {})
          en = set((audit.get("translations") or {}).get("en") or {})
          assert de == en
          assert audit.get("version") == "v0.3.372"
          assert "Current release: **v0.3.372**" in readme
          assert 'version: "0.3.372"' in compose
          print("localized backend error validation passed")
          PY
