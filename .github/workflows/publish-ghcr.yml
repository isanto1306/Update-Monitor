name: One-time self update reload fix

on:
  push:
    branches:
      - fix-self-update-reload-v0332

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch self update reload and bump version
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          index_path = Path("static/index.html")
          index = index_path.read_text(encoding="utf-8")

          function_marker = "async function waitForSelfUpdateRestart("
          if index.count(function_marker) != 1:
              raise SystemExit(f"Expected exactly one {function_marker!r}, found {index.count(function_marker)}")

          function_start = index.index(function_marker)
          function_end = index.index("\nasync function installImageUpdate(", function_start)
          function_text = index[function_start:function_end]

          gate_start_marker = "    if(restarted){"
          gate_start = function_text.index(gate_start_marker)
          wait_marker = "\n\n    await new Promise(resolve=>setTimeout(resolve,1000));"
          gate_end = function_text.index(wait_marker, gate_start)

          replacement_gate = "    if(restarted){\n      return true;\n    }"
          function_text = (
              function_text[:gate_start]
              + replacement_gate
              + function_text[gate_end:]
          )
          index = index[:function_start] + function_text + index[function_end:]

          old_comment = (
              "    if(verified){\n"
              "      // The replacement container is running and its targeted verification is complete.\n"
              "      // Reload this browser tab so Edge/other browsers immediately load the new frontend.\n"
              "      window.setTimeout(()=>window.location.reload(),700);\n"
              "      return;\n"
              "    }"
          )
          new_comment = (
              "    if(verified){\n"
              "      // The replacement container is running. Reload immediately so the browser\n"
              "      // loads the new frontend; targeted verification continues independently.\n"
              "      window.setTimeout(()=>window.location.reload(),700);\n"
              "      return;\n"
              "    }"
          )
          if index.count(old_comment) != 1:
              raise SystemExit(f"Expected one self-update reload comment block, found {index.count(old_comment)}")
          index = index.replace(old_comment, new_comment, 1)

          old_version = "0.3.331"
          new_version = "0.3.332"
          version_hits = index.count(old_version)
          if version_hits < 1:
              raise SystemExit(f"Expected at least one {old_version} in static/index.html")
          index = index.replace(old_version, new_version)
          index_path.write_text(index, encoding="utf-8")

          main_path = Path("app/main.py")
          main = main_path.read_text(encoding="utf-8")
          old_main_version = 'VERSION = "0.3.331"'
          new_main_version = 'VERSION = "0.3.332"'
          if main.count(old_main_version) != 1:
              raise SystemExit(f"Expected exactly one backend version declaration, found {main.count(old_main_version)}")
          main = main.replace(old_main_version, new_main_version, 1)
          main_path.write_text(main, encoding="utf-8")

          original_workflow = base64.b64decode("").decode("utf-8")
          Path(".github/workflows/publish-ghcr.yml").write_text(original_workflow, encoding="utf-8")

          print(f"Patched self-update reload; frontend version hits updated: {version_hits}")
          PY

          git diff --check
          git add static/index.html app/main.py .github/workflows/publish-ghcr.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix self update browser reload"
          git push origin HEAD:fix-self-update-reload-v0332
