name: Publish Docker image

on:
  workflow_run:
    workflows:
      - Validate and synchronize release
    types:
      - completed
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only one publish attempt may inspect/build GHCR at a time. This closes the
# race where several successful validation runs for the same version finish
# within seconds and all rebuild the same release before the first push settles.
concurrency:
  group: publish-update-monitor
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out synchronized main
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out requested ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' docker-compose.zimaos.yml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read x-casaos version from docker-compose.zimaos.yml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Update Monitor version $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Public Docker Hub cache: avoids intermittent registry-1.docker.io timeouts.
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable release image
        id: release_guard
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/update-monitor
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          set -euo pipefail
          inspect_output="$(mktemp)"
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >"$inspect_output" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} already exists. The version is immutable, so this workflow will not rebuild or move latest."
            exit 0
          fi

          if grep -Eqi 'manifest unknown|not found|name unknown' "$inspect_output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing ${IMAGE}:${VERSION} manifest found; a new release image may be published."
            exit 0
          fi

          echo "Could not safely determine whether ${IMAGE}:${VERSION} already exists:" >&2
          cat "$inspect_output" >&2
          exit 1

      - name: Docker metadata
        id: meta
        if: steps.release_guard.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/update-monitor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.app_version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        if: steps.release_guard.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
