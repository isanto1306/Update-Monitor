name: One-time v0.3.378 synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0378.yml

permissions:
  contents: write

jobs:
  synchronize-v0378:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump release markers to v0.3.378
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected marker in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('app/main.py', 'VERSION = "0.3.377"', 'VERSION = "0.3.378"')
          replace_exact('docker-compose.zimaos.yml', '  version: "0.3.377"', '  version: "0.3.378"')
          replace_exact('static/site.webmanifest', '?v=0.3.377', '?v=0.3.378')
          replace_exact('static/update-channel.js', 'um-update-channel-v0377', 'um-update-channel-v0378')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.377', '/update-channel.js?v=0.3.378')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.378-auto1', '/update-channel.js?v=0.3.378-ui1')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Current release: **v0.3.377**', 'Current release: **v0.3.378**', 1)
          marker = 'v0.3.377 restores the original responsive Update Monitor dashboard behavior when “Automatic” is selected.'
          if marker not in text:
              raise SystemExit('README v0.3.377 marker missing')
          entry = (
              'v0.3.378 refines manual display scaling while leaving Automatic unchanged. '
              'Manual choices now run from 105% to 130% in 5% steps. The selected scale applies to the complete dashboard foreground, including the last-check/search/sort toolbar and app cards, plus modal layouts such as Docker information, Backup Settings, Update Channel, Image Source and update-policy dialogs, while the fixed wallpaper remains unscaled. '
              'The display selector now uses the same fixed popup behavior as Language so opening it no longer pushes or scrolls the Settings panel.\n\n'
          )
          text = text.replace(marker, entry + marker, 1)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.378 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          js = Path('static/layout-options.js').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert "MODES={auto:true,'105':true,'110':true,'115':true,'120':true,'125':true,'130':true}" in js
          assert '<option value="100">' not in js
          for value in ('105','110','115','120','125','130'):
              assert f'<option value="{value}">{value} %</option>' in js
          assert "return mode==='auto'?'':mode" in js
          assert 'html[data-um-card-scale] main' in js
          assert '[class*="-backdrop"]>[role="dialog"][aria-modal="true"]' in js
          assert "wrapper.classList.add('settings-interval-fixed')" in js
          assert 'Automatisch wird je nach Displaygröße angepasst.' in js
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.378';" in html
          assert 'id="systemInfoVersion">v0.3.378</div>' in html
          PY

      - name: Commit synchronized v0.3.378
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.378 unified manual UI scaling"
          git push
