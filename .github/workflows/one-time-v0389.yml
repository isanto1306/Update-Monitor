name: One-time v0.3.389 digest-pin version support

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0389.yml

permissions:
  contents: write

jobs:
  release-v0389:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add manual version switching for digest-pinned images
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/main.py")
          text = p.read_text(encoding="utf-8")

          old_skip = 'if item.get("update_policy") in {"digest_pinned", "local"}:'
          if text.count(old_skip) != 2:
              raise SystemExit(f"Expected 2 digest/local skip guards, found {text.count(old_skip)}")
          text = text.replace(old_skip, 'if item.get("update_policy") == "local":')

          old_guard = '''        old_ref = str(item.get("image_ref") or "").strip()
                  parsed = parse_image_ref(old_ref)
                  if parsed.get("pinned_digest"):
                      raise RuntimeError("Digest-pinned images cannot be changed by this path")
                  if not old_ref or not parsed.get("repo"):
                      raise RuntimeError("Could not determine the configured image reference")
          '''
          new_guard = '''        old_ref = str(item.get("image_ref") or "").strip()
                  parsed = parse_image_ref(old_ref)
                  digest_pinned = bool(
                      item.get("compose_digest_pin_proven")
                      or parsed.get("pinned_digest")
                  )
                  if digest_pinned and mode != "upgrade":
                      raise RuntimeError(
                          "Digest-pinned images can only switch versions manually"
                      )
                  if not old_ref or not parsed.get("repo"):
                      raise RuntimeError("Could not determine the configured image reference")
          '''
          if old_guard not in text:
              raise SystemExit("Digest-pin version-update guard marker missing")
          text = text.replace(old_guard, new_guard, 1)

          old_target = '''        new_ref = _update_target_ref_on_active_registry(
                      item,
                      requested_tag=exact_target_tag,
                  )
                  if not new_ref:
                      raise RuntimeError(
                          f"Could not determine the active Docker registry for {old_ref}"
                      )
          '''
          new_target = '''        tag_ref = _update_target_ref_on_active_registry(
                      item,
                      requested_tag=exact_target_tag,
                  )
                  if not tag_ref:
                      raise RuntimeError(
                          f"Could not determine the active Docker registry for {old_ref}"
                      )

                  new_ref = tag_ref
                  target_pin_digest = None
                  if digest_pinned:
                      parsed_target = parse_image_ref(tag_ref)
                      target_repo = str(parsed_target.get("normalized_repo") or "").strip()
                      if not target_repo:
                          raise RuntimeError(
                              f"Could not determine the registry repository for {tag_ref}"
                          )

                      # Preserve an intentional Compose digest pin when the user
                      # manually switches to another concrete version. With no
                      # platform argument the registry helper returns the top
                      # manifest/index digest from Docker-Content-Digest, which is
                      # the correct immutable pin for the selected release tag.
                      pin_digests, pin_error = registry_manifest_digests(
                          target_repo,
                          exact_target_tag,
                          platform=None,
                          timeout=12,
                      )
                      pin_digests = sorted(
                          str(value or "").strip().lower()
                          for value in (pin_digests or [])
                          if str(value or "").strip().lower().startswith("sha256:")
                      )
                      if pin_error or not pin_digests:
                          raise RuntimeError(
                              f"Could not resolve an immutable digest for {tag_ref}: "
                              f"{pin_error or 'no registry digest returned'}. "
                              "The configuration was left unchanged."
                          )
                      target_pin_digest = pin_digests[0]
                      new_ref = f"{tag_ref}@{target_pin_digest}"
          '''
          if old_target not in text:
              raise SystemExit("Version target-ref marker missing")
          text = text.replace(old_target, new_target, 1)

          old_plan = '''            "follow_target_digests": list(item.get("follow_target_digests") or []),
                      "source_version_hint": source_version_hint or None,
          '''
          new_plan = '''            "follow_target_digests": list(item.get("follow_target_digests") or []),
                      "digest_pinned": digest_pinned,
                      "target_pin_digest": target_pin_digest,
                      "source_version_hint": source_version_hint or None,
          '''
          if old_plan not in text:
              raise SystemExit("Version plan marker missing")
          text = text.replace(old_plan, new_plan, 1)

          if 'VERSION = "0.3.388"' not in text:
              raise SystemExit("Backend version marker missing")
          text = text.replace('VERSION = "0.3.388"', 'VERSION = "0.3.389"', 1)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Bump release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing marker in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("docker-compose.zimaos.yml", '  version: "0.3.388"', '  version: "0.3.389"')
          replace_once("docker-compose.zimaos.yml", '  update_at: "2026-09-25"', '  update_at: "2026-10-08"')
          replace_once("static/site.webmanifest", "?v=0.3.388", "?v=0.3.389")
          replace_once("static/site.webmanifest", "?v=0.3.388", "?v=0.3.389")
          replace_once("static/update-channel.js", "um-update-channel-v0388", "um-update-channel-v0389")
          replace_once(
              "Dockerfile",
              's.replace("/update-channel.js?v=0.3.388", "/update-channel.js?v=0.3.388-dialogcap1", 1)',
              's.replace("/update-channel.js?v=0.3.389", "/update-channel.js?v=0.3.389-digestpin1", 1)',
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "Current release: **v0.3.388**" not in text:
              raise SystemExit("README release marker missing")
          text = text.replace("Current release: **v0.3.388**", "Current release: **v0.3.389**", 1)
          marker = "v0.3.388 adds a viewport-safe height cap"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit("README v0.3.388 entry missing")
          entry = (
              "v0.3.389 adds safe manual version discovery and switching for intentionally "
              "digest-pinned Compose images. Version lists are now loaded for pinned registry "
              "images, and a manual version change preserves immutability by resolving and "
              "writing the selected tag together with its verified registry digest. Moving-tag "
              "follow mode remains blocked for intentional digest pins.\n\n"
          )
          text = text[:pos] + entry + text[pos:]
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.389
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path

          py = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          compose = Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")

          assert 'VERSION = "0.3.389"' in py
          assert 'if item.get("update_policy") in {"digest_pinned", "local"}:' not in py
          assert py.count('if item.get("update_policy") == "local":') >= 2
          assert 'item.get("compose_digest_pin_proven")' in py
          assert 'Digest-pinned images can only switch versions manually' in py
          assert 'target_pin_digest = pin_digests[0]' in py
          assert 'new_ref = f"{tag_ref}@{target_pin_digest}"' in py
          assert 'version: "0.3.389"' in compose
          assert 'update_at: "2026-10-08"' in compose
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.389';" in html
          assert 'id="systemInfoVersion">v0.3.389</div>' in html
          assert '/update-channel.js?v=0.3.389-digestpin1' in dockerfile
          PY

      - name: Commit synchronized v0.3.389
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.389 support digest-pinned version changes"
          git pull --rebase origin main
          git push origin HEAD:main
