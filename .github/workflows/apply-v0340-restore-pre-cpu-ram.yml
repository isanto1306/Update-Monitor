name: Apply v0.3.340 pre CPU RAM restore

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0340-restore-pre-cpu-ram.yml'

permissions:
  contents: write

jobs:
  apply-restore-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set restored release version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          index_path = Path('static/index.html')
          readme_path = Path('README.md')

          main = main_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          if 'VERSION = "0.3.328"' not in main:
              raise SystemExit('Expected pre CPU/RAM backend version 0.3.328 not found')
          main = main.replace('VERSION = "0.3.328"', 'VERSION = "0.3.340"', 1)

          if '0.3.330' not in index:
              raise SystemExit('Expected pre CPU/RAM frontend version 0.3.330 not found')
          index = index.replace('0.3.330', '0.3.340')

          readme = readme.replace('0.3.328', '0.3.340')
          readme = readme.replace('0.3.330', '0.3.340')

          main_path.write_text(main, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate restored sources
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/main.py').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')

          assert 'VERSION = "0.3.340"' in main
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.340';" in html
          assert 'renderAppResourceStat' not in html
          assert 'update-card-stat-resource' not in html
          assert 'um-card-resource-port-v0331' not in html
          assert '0.3.340' in readme

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          Path('/tmp/update-monitor.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit restored v0.3.340 sources
        shell: bash
        run: |
          rm -f .github/workflows/apply-v0340-restore-pre-cpu-ram.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore pre CPU RAM card state v0.3.340"
          git push origin HEAD:main
