name: Repair v0.3.349

on:
  push:
    branches:
      - repair-v0.3.349

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-v0.3.349
          fetch-depth: 0

      - name: Apply v0.3.349 repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          if 'VERSION = "0.3.348"' not in s:
              raise SystemExit('Expected backend version 0.3.348')
          s = s.replace('VERSION = "0.3.348"', 'VERSION = "0.3.349"', 1)

          old = '''                if zimaos_latest_tracking_ref:\n                    tracking_image_ref = zimaos_latest_tracking_ref\n                    parsed = parse_image_ref(tracking_image_ref)\n'''
          new = '''                if zimaos_latest_tracking_ref:\n                    tracking_image_ref = zimaos_latest_tracking_ref\n                    parsed = parse_image_ref(tracking_image_ref)\n\n                    # ZimaOS may persist a rolling :latest source as\n                    # repo:latest@sha256:<resolved>. That digest is authoritative\n                    # local evidence for the currently active image and must take\n                    # part in the remote comparison; otherwise a perfectly current\n                    # image can be reported as IMAGE_UPDATE merely because Docker\n                    # omitted RepoDigests for the local tag.\n                    managed_digest = str(explicit_pinned_digest or "").strip().lower()\n                    if managed_digest:\n                        local.add(managed_digest)\n                        local_all_digests.add(managed_digest)\n                        if len(local_digest_groups) == 1:\n                            local_digest_groups[0] = sorted(\n                                set(local_digest_groups[0]).union({managed_digest})\n                            )\n'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one ZimaOS latest block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          start = s.index('def perform_image_update(app_item):')
          end = s.index('\n\n_DOCKER_INFO_LABEL_PREFIXES', start)
          fn = s[start:end]
          required = [
              'restore_pin_targets = []',
              'if item.get("restore_generated_digest_pin"):',
              'restore_pin_applied = False',
              'if restore_pin_targets:',
              'for restore_target in restore_pin_targets:',
              'if restore_pin_applied:',
          ]
          for token in required:
              if token not in fn:
                  raise SystemExit(f'Missing expected perform_image_update token: {token}')

          fn = fn.replace('restore_pin_targets = []', 'tracking_pin_targets = []', 1)
          fn = fn.replace(
              'if item.get("restore_generated_digest_pin"):\n            restore_pin_targets.append({',
              'if item.get("restore_generated_digest_pin") or item.get("zimaos_managed_latest_digest"):\n            tracking_pin_targets.append({',
              1,
          )
          fn = fn.replace('restore_pin_applied = False', 'tracking_pin_applied = False', 1)
          fn = fn.replace('if restore_pin_targets:', 'if tracking_pin_targets:', 1)
          fn = fn.replace('for restore_target in restore_pin_targets:', 'for tracking_target in tracking_pin_targets:', 1)
          fn = fn.replace('restore_target.get("services")', 'tracking_target.get("services")')
          fn = fn.replace('restore_target.get("image_ref")', 'tracking_target.get("image_ref")')
          fn = fn.replace(
              '"Backup restore source could not be returned to its original "\n                "tracking tag before the update"',
              '"The rolling image source could not be normalized to its tracking "\n                "tag before the update"',
              1,
          )
          fn = fn.replace(
              '# This mutation happens only because the user explicitly requested the\n        # available update. The target image was pulled and digest-verified above.',
              '# ZimaOS-managed latest@digest references and restore-generated digest\n        # locks must first be returned to the real rolling tag. The target image\n        # was already pulled and digest-verified above.',
              1,
          )
          fn = fn.replace('restore_pin_applied = True', 'tracking_pin_applied = True', 1)
          fn = fn.replace('if restore_pin_applied:', 'if tracking_pin_applied:', 1)
          fn = fn.replace(
              '# ZimaOS already recreated the stack when the Compose source was\n            # returned from our internal backup digest to the user\'s tracking\n            # tag. Verify the running container directly against the pulled\n            # target digest instead of forcing a second recreation.',
              '# Applying the normalized tracking tag already lets ZimaOS recreate\n            # the stack. Verify that result directly against the pulled target\n            # digest instead of forcing a second recreation that could reapply\n            # the old resolved digest.',
              1,
          )
          s = s[:start] + fn + s[end:]
          p.write_text(s, encoding='utf-8')

          # Synchronize active release/cache markers. Historical v0.3.xxx comments
          # are not touched because only the exact current marker is replaced.
          for name in [
              'README.md',
              'docker-compose.zimaos.yml',
              'static/index.html',
              'static/site.webmanifest',
              'translation-audit-current.json',
          ]:
              q = Path(name)
              if not q.exists():
                  continue
              text = q.read_text(encoding='utf-8')
              text = text.replace('0.3.348', '0.3.349')
              q.write_text(text, encoding='utf-8')
          PY

      - name: Backend syntax and targeted regression
        run: |
          python3 -m py_compile app/main.py
          UPDATE_MONITOR_USERNAME=test \
          UPDATE_MONITOR_PASSWORD=123456789012 \
          UPDATE_MONITOR_SESSION_SECRET=12345678901234567890123456789012 \
          UPDATE_MONITOR_CACHE_DIR=/tmp/update-monitor-v0349 \
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'app')
          import main

          applied=[]
          main.is_update_monitor_self_app=lambda app: False
          main.scan_state['platform']='linux/amd64'
          main.docker_pull_verified=lambda ref, platform: {
              'expected_digests':['sha256:new'],
              'image_ref':ref,
          }
          main.casaos_compose_yaml=lambda project: (
              'services:\n  disk-monitor:\n'
              '    image: ghcr.io/isanto1306/disk-monitor:latest@sha256:old\n'
          )
          def replace_yaml(yaml_text, services, new_ref):
              assert services == ['disk-monitor']
              assert new_ref == 'ghcr.io/isanto1306/disk-monitor:latest'
              updated=yaml_text.replace(
                  'ghcr.io/isanto1306/disk-monitor:latest@sha256:old', new_ref
              )
              return updated, 1, ['disk-monitor']
          main.replace_compose_service_images=replace_yaml
          main.casaos_apply_compose=lambda project, yaml_text, dry_run=False: applied.append((dry_run,yaml_text))
          main.docker_container_id=lambda name: 'container-new'
          main.docker_container_image_id=lambda name: 'sha256:image-id'
          main.docker_container_runtime_snapshot=lambda name: {
              'status':'running', 'restarting':False, 'health':None,
              'config_image':'ghcr.io/isanto1306/disk-monitor:latest'
          }
          main.docker_image_repo_digests=lambda *args: ['sha256:new']
          main.docker_container_state=lambda name: 'running'
          def forbidden_recreate(*args, **kwargs):
              raise AssertionError('old digest recreate path must not run')
          main.casaos_recreate_container=forbidden_recreate

          app={
              'stack_key':'project:disk-monitor',
              'compose_project':'disk-monitor',
              'items':[{
                  'status':'IMAGE_UPDATE',
                  'update_policy':'follow_tag',
                  'image_ref':'ghcr.io/isanto1306/disk-monitor:latest@sha256:old',
                  'tracking_image_ref':'ghcr.io/isanto1306/disk-monitor:latest',
                  'zimaos_managed_latest_digest':True,
                  'containers':[{
                      'name':'disk-monitor',
                      'state':'running',
                      'compose_service':'disk-monitor',
                  }],
              }],
          }
          result=main.perform_image_update(app)
          assert result['final_states']['disk-monitor']=='running'
          assert len(applied)==2 and applied[0][0] is True and applied[1][0] is False
          assert all('@sha256:old' not in text for _,text in applied)

          assert main.zimaos_managed_latest_digest_ref(
              'ghcr.io/isanto1306/disk-monitor:latest@sha256:old',
              runtime_refs=['ghcr.io/isanto1306/disk-monitor:latest@sha256:old'],
              local_repo_tags=['ghcr.io/isanto1306/disk-monitor:latest'],
          ) == 'ghcr.io/isanto1306/disk-monitor:latest'
          print('v0.3.349 targeted regression OK')
          PY

      - name: Version audit and diff check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert 'VERSION = "0.3.349"' in Path('app/main.py').read_text()
          assert 'version: "0.3.349"' in Path('docker-compose.zimaos.yml').read_text()
          assert 'v0.3.349' in Path('README.md').read_text()
          html=Path('static/index.html').read_text()
          assert '0.3.349' in html
          assert '0.3.348' not in html
          print('version audit OK')
          PY
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py README.md docker-compose.zimaos.yml static/index.html static/site.webmanifest translation-audit-current.json
          git commit -m "Fix ZimaOS latest digest updates in v0.3.349"
          git push origin repair-v0.3.349
