name: Apply v0.3.334 fixed card layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0334-card-layout.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch_v0334.py

      - name: Validate sources
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          Path('/tmp/update-monitor.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          assert '0.3.334' in html
          assert 'um-card-resource-port-v0334' in html
          assert 'grid-template-columns:29px minmax(44px,1fr) 34px' in html
          assert 'contain:layout paint' in html
          PY
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit patched sources and remove temporary patch files
        shell: bash
        run: |
          rm -f scripts/patch_v0334.py .github/workflows/apply-v0334-card-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Fix card columns and CPU RAM layout v0.3.334"
          git push origin HEAD:main
