name: One-time v0.3.390 digest-pin installed-version fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0390.yml

permissions:
  contents: write

jobs:
  release-v0390:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve digest-pinned installed versions from digest
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/main.py")
          text = p.read_text(encoding="utf-8")

          def function_region(source, start_marker, end_marker):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          # 1) Concrete tags are authoritative only when there is no intentional
          # digest pin. Digest-pinned items may reuse only digest-bound evidence.
          start, end, region = function_region(
              text,
              "def _installed_version_resolution_reusable",
              "def _all_local_digest_groups_match_remote",
          )
          marker = "    # A concrete configured tag is authoritative on its own.\n    if not _needs_installed_version_resolution(current_tag):\n        return True\n"
          if marker not in region:
              raise SystemExit("Reusable concrete-tag marker missing")
          replacement = "\n".join([
              "    digest_pinned = bool(",
              "        item.get(\"update_policy\") == \"digest_pinned\"",
              "        or item.get(\"compose_digest_pin_proven\")",
              "        or item.get(\"compose_pinned_digest\")",
              "    )",
              "",
              "    # A concrete configured tag is authoritative only without an",
              "    # intentional digest pin. Docker runs the digest bytes even when",
              "    # the textual tag left in Compose is stale.",
              "    if not _needs_installed_version_resolution(current_tag) and not digest_pinned:",
              "        return True",
              "",
          ])
          region = region.replace(marker, replacement, 1)
          if '        "local-repotag",\n' not in region:
              raise SystemExit("Reusable local-repotag marker missing")
          region = region.replace('        "local-repotag",\n', "", 1)
          tail = '    if source.startswith("registry+"):\n        return True\n    return False\n'
          if tail not in region:
              raise SystemExit("Reusable source tail marker missing")
          tail_new = '    if source.startswith("registry+"):\n        return True\n    if source == "local-repotag" and not digest_pinned:\n        return True\n    return False\n'
          region = region.replace(tail, tail_new, 1)
          text = text[:start] + region + text[end:]

          # 2) Normal scan: digest pins bypass configured-tag and RepoTag shortcuts,
          # then resolve the actual pinned/running digest against registry versions.
          start, end, region = function_region(
              text,
              "def enrich_scan_installed_versions",
              "def enrich_scan_available_versions",
          )
          current_line = '        current_tag = str(item.get("tag") or "").strip()\n'
          if current_line not in region:
              raise SystemExit("Scan current-tag marker missing")
          insert = "\n".join([
              '        current_tag = str(item.get("tag") or "").strip()',
              '        digest_pinned = bool(',
              '            item.get("update_policy") == "digest_pinned"',
              '            or item.get("compose_digest_pin_proven")',
              '            or item.get("compose_pinned_digest")',
              '        )',
              '',
          ])
          region = region.replace(current_line, insert, 1)

          shortcut = "        if not _needs_installed_version_resolution(current_tag):\n"
          if shortcut not in region:
              raise SystemExit("Scan configured-tag shortcut missing")
          region = region.replace(
              shortcut,
              "        if not digest_pinned and not _needs_installed_version_resolution(current_tag):\n",
              1,
          )

          local_line = "        local_version, local_source = _local_installed_version(item)\n"
          if local_line not in region:
              raise SystemExit("Scan local RepoTag marker missing")
          region = region.replace(
              local_line,
              "        local_version, local_source = ((None, None) if digest_pinned else _local_installed_version(item))\n",
              1,
          )

          digest_start = region.index("        local_digests = tuple(sorted(")
          digest_end = region.index("        if not local_digests:", digest_start)
          new_digest_block = "\n".join([
              "        local_digest_values = {",
              '            str(value or "").strip().lower()',
              '            for value in (item.get("local_digests") or [])',
              '            if str(value or "").strip()',
              "        }",
              "        if digest_pinned:",
              '            pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()',
              '            if pinned_digest.startswith("sha256:"):',
              "                local_digest_values.add(pinned_digest)",
              "",
              "        local_digests = tuple(sorted(local_digest_values))",
              "",
          ])
          region = region[:digest_start] + new_digest_block + region[digest_end:]
          text = text[:start] + region + text[end:]

          # 3) Interactive version picker: resolve digest-pinned installed version
          # even when the textual tag is a concrete v0.x.y value.
          start, end, region = function_region(
              text,
              "def _app_versions_unlocked",
              '@app.get("/api/app-versions")',
          )
          block_start = region.index(
              '        resolved_installed = str(item.get("resolved_installed_tag") or "").strip()'
          )
          block_end = region.index("        if resolved_installed:", block_start)
          picker_block = "\n".join([
              '        digest_pinned = bool(',
              '            item.get("update_policy") == "digest_pinned"',
              '            or item.get("compose_digest_pin_proven")',
              '            or item.get("compose_pinned_digest")',
              '        )',
              '        resolved_installed = str(item.get("resolved_installed_tag") or "").strip()',
              '        resolution_source = str(',
              '            (item.get("installed_version_resolution") or {}).get("source") or ""',
              '        ).strip()',
              '',
              '        local_digest_values = {',
              '            str(value or "").strip().lower()',
              '            for value in (item.get("local_digests") or [])',
              '            if str(value or "").strip()',
              '        }',
              '        if digest_pinned:',
              '            pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()',
              '            if pinned_digest.startswith("sha256:"):',
              '                local_digest_values.add(pinned_digest)',
              '            if resolution_source in {"configured-tag", "local-repotag"}:',
              '                resolved_installed = ""',
              '',
              '        local_digests = sorted(local_digest_values)',
              '        if (',
              '            (digest_pinned or _needs_installed_version_resolution(current_tag))',
              '            and local_digests',
              '            and selectable',
              '        ):',
              '            resolved_installed = (',
              '                installed_version_cache_get(repo_key, local_digests, selectable)',
              '                or resolve_installed_version_tag(',
              '                    repo_key,',
              '                    local_digests,',
              '                    selectable,',
              '                    scan_platform,',
              '                )',
              '                or resolved_installed',
              '            )',
              '        elif (',
              '            not digest_pinned',
              '            and not resolved_installed',
              '            and not _needs_installed_version_resolution(current_tag)',
              '        ):',
              '            resolved_installed = current_tag',
              '',
          ])
          region = region[:block_start] + picker_block + region[block_end:]
          text = text[:start] + region + text[end:]

          if 'VERSION = "0.3.389"' not in text:
              raise SystemExit("Backend version marker missing")
          text = text.replace('VERSION = "0.3.389"', 'VERSION = "0.3.390"', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Bump release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing marker in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("docker-compose.zimaos.yml", '  version: "0.3.389"', '  version: "0.3.390"')
          replace_once("static/site.webmanifest", "?v=0.3.389", "?v=0.3.390")
          replace_once("static/site.webmanifest", "?v=0.3.389", "?v=0.3.390")
          replace_once("static/update-channel.js", "um-update-channel-v0389", "um-update-channel-v0390")
          replace_once(
              "Dockerfile",
              's.replace("/update-channel.js?v=0.3.389", "/update-channel.js?v=0.3.389-digestpin1", 1)',
              's.replace("/update-channel.js?v=0.3.390", "/update-channel.js?v=0.3.390-pindigestversion1", 1)',
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "Current release: **v0.3.389**" not in text:
              raise SystemExit("README release marker missing")
          text = text.replace("Current release: **v0.3.389**", "Current release: **v0.3.390**", 1)
          marker = "v0.3.389 adds safe manual version discovery"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit("README v0.3.389 entry missing")
          entry = (
              "v0.3.390 fixes installed-version detection for digest-pinned images. "
              "For refs such as repo:v0.105.0@sha256:..., the immutable digest now "
              "wins over a potentially stale textual tag. Update Monitor resolves "
              "the running/pinned digest against concrete registry versions, so an "
              "image already running v0.106.0 is displayed as v0.106.0 even when "
              "ZimaOS retained the older tag text.\n\n"
          )
          text = text[:pos] + entry + text[pos:]
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.390
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          py = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          compose = Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")
          assert 'VERSION = "0.3.390"' in py
          assert 'and not digest_pinned' in py
          assert 'item.get("compose_pinned_digest")' in py
          assert 'if resolution_source in {"configured-tag", "local-repotag"}:' in py
          assert '(digest_pinned or _needs_installed_version_resolution(current_tag))' in py
          assert 'version: "0.3.390"' in compose
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.390';" in html
          assert 'id="systemInfoVersion">v0.3.390</div>' in html
          assert '/update-channel.js?v=0.3.390-pindigestversion1' in dockerfile
          PY

      - name: Commit synchronized v0.3.390
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.390 resolve digest-pinned installed versions"
          git pull --rebase origin main
          git push origin HEAD:main
