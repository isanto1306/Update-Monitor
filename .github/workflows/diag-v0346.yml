name: v0.3.346 diagnostics

on:
  push:
    branches:
      - fix-v0.3.346
    paths:
      - '.github/workflows/diag-v0346.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v0.3.346
      - name: Extract relevant source context
        run: python .github/scripts/diag_v0346.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics-v0346.txt
          git commit -m "Add v0.3.346 diagnostic report"
          git push origin HEAD:fix-v0.3.346
