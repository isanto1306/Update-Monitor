name: Validate webhook hybrid branch

on:
  push:
    branches:
      - feature-webhook-hybrid-v0369

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend syntax
        run: python3 -m py_compile app/main.py

      - name: Synchronize frontend
        run: python3 .github/scripts/sync_frontend.py

      - name: Validate webhook bridge JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          from pathlib import Path

          source = Path("app/main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          bridge = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(
                  isinstance(target, ast.Name)
                  and target.id == "_INDEX_WEBHOOK_AUTOMATION_BRIDGE"
                  for target in node.targets
              ):
                  bridge = ast.literal_eval(node.value)
                  break
          assert isinstance(bridge, str)
          assert 'um-webhook-automation-v0369' in bridge
          Path("/tmp/webhook-bridge.js").write_text(
              bridge.split(">", 1)[1].rsplit("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/webhook-bridge.js

      - name: Validate webhook feature markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          import re
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          tree = ast.parse(main)
          funcs = {
              node.name: ast.get_source_segment(main, node) or ""
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          assert 'VERSION = "0.3.369"' in main
          assert "github_webhook_receiver" in funcs
          assert "sync_github_webhooks" in funcs
          assert "github_webhook_configure" in funcs
          assert "X-Hub-Signature-256" in funcs["github_webhook_receiver"]
          assert "hmac.compare_digest" in funcs["github_webhook_receiver"]
          assert 'event != "package"' in funcs["github_webhook_receiver"]
          assert 'action != "published"' in funcs["github_webhook_receiver"]
          assert "schedule_app_scan(" in funcs["github_webhook_receiver"]
          assert '"events": ["package"]' in funcs["sync_github_webhooks"]
          assert "um-webhook-automation-v0369" in html
          assert "/api/webhooks/configure" in html
          assert "/api/webhooks/sync" in html
          assert "Registry Prüfung" in html
          assert "Current release: **v0.3.369**" in Path("README.md").read_text(encoding="utf-8")
          assert 'version: "0.3.369"' in Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          print("webhook hybrid feature validation passed")
          PY
