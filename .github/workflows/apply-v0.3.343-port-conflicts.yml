name: Apply Update Monitor v0.3.343 port conflict fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.3.343-port-conflicts.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and test port conflict fix
        run: python .github/patch-v0.3.343-port-conflicts.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'VERSION = "0.3.343"' app/main.py
          grep -q "const UPDATE_MONITOR_VERSION = 'v0.3.343';" static/index.html

      - name: Commit v0.3.343
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch-v0.3.343-port-conflicts.py .github/workflows/apply-v0.3.343-port-conflicts.yml
          git add static/index.html app/main.py .github/patch-v0.3.343-port-conflicts.py .github/workflows/apply-v0.3.343-port-conflicts.yml
          git commit -m "Restore configured port conflicts with runtime status v0.3.343"
          git push origin main
