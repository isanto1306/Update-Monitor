name: Inspect self update UI once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-self-update-ui-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show installImageUpdate function
        shell: bash
        run: |
          start=$(grep -n -m1 "async function installImageUpdate" static/index.html | cut -d: -f1)
          echo "start=$start"
          if [ -n "$start" ]; then
            end=$((start + 260))
            sed -n "${start},${end}p" static/index.html
          fi
