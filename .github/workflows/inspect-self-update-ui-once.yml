name: Inspect self update UI once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-self-update-ui-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show self update context
        shell: bash
        run: |
          for fn in "waitForPostUpdateVerification" "appUpdateVerifiedCurrent" "isUpdateTransportFailure" "async function loadStatus" "function verificationBaseline"; do
            echo "--- $fn ---"
            grep -n -A 180 -B 35 "$fn" static/index.html | head -n 260 || true
          done
