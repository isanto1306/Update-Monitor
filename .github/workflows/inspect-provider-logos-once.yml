name: Inspect provider logos once

on:
  push:
    branches:
      - provider-logo-adjustment
    paths:
      - '.github/workflows/inspect-provider-logos-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show provider UI context
        shell: bash
        run: |
          echo '--- base styles ---'
          sed -n '7945,8010p' static/index.html
          echo '--- later overrides ---'
          sed -n '15245,15395p' static/index.html
          echo '--- render functions ---'
          sed -n '20045,20105p' static/index.html
