name: Apply provider logos once

on:
  push:
    branches:
      - provider-logo-adjustment
    paths:
      - '.github/workflows/inspect-provider-logos-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply provider logo UI
        run: python .github/scripts/apply_provider_logos_v0321.py

      - name: Validate UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/update-monitor-ui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/update-monitor-ui.js
          grep -q "UPDATE_MONITOR_VERSION = 'v0.3.321'" static/index.html
          grep -q 'um-provider-logo-buttons-v0321' static/index.html
          grep -q "case 'dockerhub': return 'Docker Hub'" static/index.html
          grep -q 'version: "0.3.321"' docker-compose.zimaos.yml
          grep -q 'Current release: \*\*v0.3.321\*\*' README.md

      - name: Commit test branch result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html docker-compose.zimaos.yml README.md
          git diff --cached --quiet && exit 0
          git commit -m "Add provider logos v0.3.321"
          git push
