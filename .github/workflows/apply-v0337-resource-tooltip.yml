name: Apply v0.3.337 resource tooltip fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0337-resource-tooltip.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.3.337 resource tooltip patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          OLD_VERSION = '0.3.336'
          NEW_VERSION = '0.3.337'

          index_path = Path('static/index.html')
          main_path = Path('app/main.py')

          index = index_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')

          # Replace only the resource-card renderer/synchronizer. Port rendering and
          # the rest of the fixed card geometry are intentionally left untouched.
          pattern = re.compile(
              r'function renderAppResourceStat\(app\)\{.*?\n\}\nfunction syncAppResourceStat\(app\)\{.*?\n\}\nfunction renderAppPortStat\(app\)\{',
              re.S,
          )
          replacement = r'''function cardResourceHoverData(app){
            const language=String(state.language||'de');
            const labels={
              de:{cpu:'CPU Verbrauch',ram:'Arbeitsspeicherverbrauch'},
              en:{cpu:'CPU usage',ram:'Memory usage'},
              fr:{cpu:'Utilisation CPU',ram:'Utilisation mémoire'},
              pt:{cpu:'Uso de CPU',ram:'Uso de memória'},
              es:{cpu:'Uso de CPU',ram:'Uso de memoria'}
            };
            const text=labels[language]||labels.en;
            const cpuText=formatCardResourcePercent(app.cpu_percent);
            const memoryText=formatCardResourcePercent(app.memory_percent);
            const ramTip=cardRamTooltip(app.memory_usage);
            const ramDetail=ramTip.detail?`${ramTip.detail} · ${memoryText}`:memoryText;
            return {cpuTitle:text.cpu,cpuDetail:cpuText,ramTitle:text.ram,ramDetail};
          }
          function ensureResourceHoverTooltip(){
            let tip=document.getElementById('updateResourceHoverTooltip');
            if(tip)return tip;
            tip=document.createElement('div');
            tip.id='updateResourceHoverTooltip';
            tip.className='update-resource-hover-tooltip';
            tip.hidden=true;
            tip.innerHTML=`<div class="update-resource-hover-section"><strong data-hover-cpu-title></strong><span data-hover-cpu-detail></span></div><div class="update-resource-hover-section"><strong data-hover-ram-title></strong><span data-hover-ram-detail></span></div>`;
            document.body.appendChild(tip);
            return tip;
          }
          let activeResourceHoverNode=null;
          function positionResourceHoverTooltip(node){
            const tip=ensureResourceHoverTooltip();
            if(!node||tip.hidden)return;
            const anchor=node.getBoundingClientRect();
            const margin=8;
            const gap=8;
            const box=tip.getBoundingClientRect();
            let left=anchor.left+(anchor.width-box.width)/2;
            let top=anchor.bottom+gap;
            if(top+box.height>window.innerHeight-margin){
              top=anchor.top-box.height-gap;
            }
            left=Math.max(margin,Math.min(left,window.innerWidth-box.width-margin));
            top=Math.max(margin,Math.min(top,window.innerHeight-box.height-margin));
            tip.style.left=`${Math.round(left)}px`;
            tip.style.top=`${Math.round(top)}px`;
          }
          function showResourceHoverTooltip(node){
            if(!node)return;
            const tip=ensureResourceHoverTooltip();
            const cpuTitle=tip.querySelector('[data-hover-cpu-title]');
            const cpuDetail=tip.querySelector('[data-hover-cpu-detail]');
            const ramTitle=tip.querySelector('[data-hover-ram-title]');
            const ramDetail=tip.querySelector('[data-hover-ram-detail]');
            if(cpuTitle)cpuTitle.textContent=node.dataset.resourceCpuTitle||'CPU';
            if(cpuDetail)cpuDetail.textContent=node.dataset.resourceCpuDetail||'–';
            if(ramTitle)ramTitle.textContent=node.dataset.resourceRamTitle||'RAM';
            if(ramDetail)ramDetail.textContent=node.dataset.resourceRamDetail||'–';
            activeResourceHoverNode=node;
            tip.hidden=false;
            requestAnimationFrame(()=>positionResourceHoverTooltip(node));
          }
          function hideResourceHoverTooltip(node){
            if(node&&activeResourceHoverNode&&node!==activeResourceHoverNode)return;
            const tip=document.getElementById('updateResourceHoverTooltip');
            if(tip)tip.hidden=true;
            activeResourceHoverNode=null;
          }
          function bindResourceHoverTooltip(){
            if(document.documentElement.dataset.resourceHoverBound==='1')return;
            document.documentElement.dataset.resourceHoverBound='1';
            document.addEventListener('pointerover',event=>{
              const node=event.target.closest?.('.update-card-stat-resource[data-resource-stack]');
              if(!node)return;
              if(event.relatedTarget&&node.contains(event.relatedTarget))return;
              showResourceHoverTooltip(node);
            });
            document.addEventListener('pointerout',event=>{
              const node=event.target.closest?.('.update-card-stat-resource[data-resource-stack]');
              if(!node)return;
              if(event.relatedTarget&&node.contains(event.relatedTarget))return;
              hideResourceHoverTooltip(node);
            });
            document.addEventListener('focusin',event=>{
              const node=event.target.closest?.('.update-card-stat-resource[data-resource-stack]');
              if(node)showResourceHoverTooltip(node);
            });
            document.addEventListener('focusout',event=>{
              const node=event.target.closest?.('.update-card-stat-resource[data-resource-stack]');
              if(node)hideResourceHoverTooltip(node);
            });
            window.addEventListener('resize',()=>{
              if(activeResourceHoverNode)positionResourceHoverTooltip(activeResourceHoverNode);
            });
            window.addEventListener('scroll',()=>hideResourceHoverTooltip(),true);
          }
          bindResourceHoverTooltip();
          function renderAppResourceStat(app){
            const cpuText=formatCardResourcePercent(app.cpu_percent);
            const memoryText=formatCardResourcePercent(app.memory_percent);
            const cpuBar=cardResourceBarPercent(app.cpu_percent);
            const memoryBar=cardResourceBarPercent(app.memory_percent);
            const hover=cardResourceHoverData(app);
            return `<div class="update-card-stat update-card-stat-resource" tabindex="0" data-resource-stack="${esc(String(app.stack_key||''))}" data-resource-cpu-title="${esc(hover.cpuTitle)}" data-resource-cpu-detail="${esc(hover.cpuDetail)}" data-resource-ram-title="${esc(hover.ramTitle)}" data-resource-ram-detail="${esc(hover.ramDetail)}">
              <div class="update-card-stat-label update-resource-title">CPU / RAM</div>
              <div class="update-resource-bars">
                <div class="update-resource-row update-resource-cpu-row">
                  <span class="update-resource-name">CPU</span>
                  <span class="update-resource-track"><span class="update-resource-fill" data-resource-cpu-bar style="width:${cpuBar}%"></span></span>
                  <span class="update-resource-percent" data-resource-cpu>${esc(cpuText)}</span>
                </div>
                <div class="update-resource-row update-resource-ram-row">
                  <span class="update-resource-name">RAM</span>
                  <span class="update-resource-track"><span class="update-resource-fill" data-resource-ram-bar style="width:${memoryBar}%"></span></span>
                  <span class="update-resource-percent" data-resource-ram>${esc(memoryText)}</span>
                </div>
              </div>
            </div>`;
          }
          function syncAppResourceStat(app){
            const key=String(app.stack_key||'');
            const cpuText=formatCardResourcePercent(app.cpu_percent);
            const memoryText=formatCardResourcePercent(app.memory_percent);
            const cpuBarValue=cardResourceBarPercent(app.cpu_percent);
            const ramBarValue=cardResourceBarPercent(app.memory_percent);
            const hover=cardResourceHoverData(app);
            document.querySelectorAll('[data-resource-stack]').forEach(node=>{
              if(String(node.dataset.resourceStack||'')!==key)return;
              const cpu=node.querySelector('[data-resource-cpu]');
              const ram=node.querySelector('[data-resource-ram]');
              const cpuBar=node.querySelector('[data-resource-cpu-bar]');
              const ramBar=node.querySelector('[data-resource-ram-bar]');
              if(cpu)cpu.textContent=cpuText;
              if(ram)ram.textContent=memoryText;
              if(cpuBar)cpuBar.style.width=`${cpuBarValue}%`;
              if(ramBar)ramBar.style.width=`${ramBarValue}%`;
              node.dataset.resourceCpuTitle=hover.cpuTitle;
              node.dataset.resourceCpuDetail=hover.cpuDetail;
              node.dataset.resourceRamTitle=hover.ramTitle;
              node.dataset.resourceRamDetail=hover.ramDetail;
              if(activeResourceHoverNode===node)showResourceHoverTooltip(node);
            });
          }
          function renderAppPortStat(app){'''
          index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit(f'resource renderer patch count={count}, expected 1')

          # Restore the CPU chip icon while keeping the redundant CPU / RAM text hidden.
          # The hover tooltip is fixed to the viewport and therefore cannot be clipped by
          # card overflow or narrow port layouts.
          style = r'''
          <style id="um-card-resource-tooltip-v0337">
          .update-card-summary > .update-card-stats > .update-card-stat-resource{
            position:relative !important;
            cursor:default !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat-resource::before{
            display:block !important;
            content:"" !important;
            position:relative !important;
            left:auto !important;
            top:auto !important;
            flex:0 0 24px !important;
            width:24px !important;
            height:24px !important;
            margin:0 auto 5px !important;
            transform:none !important;
            background:#69adff !important;
          }
          .update-card-stat-resource .update-resource-title{
            display:none !important;
          }
          .update-card-stat-resource .update-resource-bars{
            width:103px !important;
            min-width:103px !important;
            max-width:103px !important;
          }
          .update-card-stat-resource .update-resource-row{
            width:103px !important;
            min-width:103px !important;
            max-width:103px !important;
            grid-template-columns:30px 68px !important;
            column-gap:5px !important;
          }
          .update-card-stat-resource .update-resource-track{
            width:68px !important;
            min-width:68px !important;
            max-width:68px !important;
          }
          .update-resource-hover-tooltip{
            position:fixed !important;
            z-index:2147483000 !important;
            box-sizing:border-box !important;
            min-width:176px !important;
            width:max-content !important;
            max-width:calc(100vw - 16px) !important;
            padding:8px 10px !important;
            border:1px solid #39444d !important;
            border-radius:6px !important;
            background:#1d2329 !important;
            box-shadow:0 6px 18px rgba(0,0,0,.38) !important;
            color:#e7edf2 !important;
            font-size:11px !important;
            line-height:1.25 !important;
            white-space:normal !important;
            overflow-wrap:anywhere !important;
            pointer-events:none !important;
          }
          .update-resource-hover-tooltip[hidden]{display:none !important;}
          .update-resource-hover-section{
            display:flex !important;
            flex-direction:column !important;
            gap:2px !important;
          }
          .update-resource-hover-section + .update-resource-hover-section{
            margin-top:7px !important;
            padding-top:7px !important;
            border-top:1px solid rgba(255,255,255,.09) !important;
          }
          .update-resource-hover-section strong{
            color:#f0f4f7 !important;
            font-size:11px !important;
            font-weight:700 !important;
          }
          .update-resource-hover-section span{
            display:block !important;
            max-width:240px !important;
            color:#d5e0e8 !important;
          }
          </style>
          '''
          if 'id="um-card-resource-tooltip-v0337"' in index:
              raise SystemExit('v0.3.337 resource tooltip style already present')
          if '</head>' not in index:
              raise SystemExit('head close missing')
          index = index.replace('</head>', style + '\n</head>', 1)

          if OLD_VERSION not in index:
              raise SystemExit(f'{OLD_VERSION} not found in static/index.html')
          index = index.replace(OLD_VERSION, NEW_VERSION)

          old_main = f'VERSION = "{OLD_VERSION}"'
          new_main = f'VERSION = "{NEW_VERSION}"'
          if old_main not in main:
              raise SystemExit(f'{old_main} not found in app/main.py')
          main = main.replace(old_main, new_main, 1)

          index_path.write_text(index, encoding='utf-8')
          main_path.write_text(main, encoding='utf-8')
          PY

      - name: Validate sources
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('static/index.html').read_text(encoding='utf-8')
          assert '0.3.337' in html
          assert 'um-card-resource-tooltip-v0337' in html
          assert "de:{cpu:'CPU Verbrauch',ram:'Arbeitsspeicherverbrauch'}" in html
          assert "tip.id='updateResourceHoverTooltip'" in html
          assert 'data-resource-cpu-title' in html
          assert 'display:block !important;' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/update-monitor.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit final sources
        shell: bash
        run: |
          rm -f .github/workflows/apply-v0337-resource-tooltip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Fix CPU RAM hover tooltip v0.3.337"
          git push origin HEAD:main
