name: Apply v0.3.332 source patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch_v0332.py

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html app/main.py docker-compose.zimaos.yml
          git commit -m "Update Monitor v0.3.332"
          git push origin HEAD:main
