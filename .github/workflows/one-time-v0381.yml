name: One-time v0.3.381 synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0381.yml

permissions:
  contents: write

jobs:
  synchronize-v0381:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump release markers to v0.3.381
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected marker in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('app/main.py', 'VERSION = "0.3.380"', 'VERSION = "0.3.381"')
          replace_exact('docker-compose.zimaos.yml', '  version: "0.3.380"', '  version: "0.3.381"')
          replace_exact('static/site.webmanifest', '?v=0.3.380', '?v=0.3.381')
          replace_exact('static/update-channel.js', 'um-update-channel-v0380', 'um-update-channel-v0381')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.380', '/update-channel.js?v=0.3.381')
          replace_exact('Dockerfile', '/update-channel.js?v=0.3.381-display1', '/update-channel.js?v=0.3.381-edge1')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Current release: **v0.3.380**', 'Current release: **v0.3.381**', 1)
          marker = 'v0.3.380 simplifies display scaling to only Automatic and Manual.'
          if marker not in text:
              raise SystemExit('README v0.3.380 marker missing')
          entry = (
              'v0.3.381 improves Manual display scaling with a 40 px safety boundary on both viewport edges. '
              'The manual column count now keeps the current number of cards until the scaled cards would cross that boundary, then drops exactly one column as needed. '
              'The custom percentage field is placed directly to the right of the Manual selector and displays the complete value including the percent sign, for example 110 %. Automatic remains unchanged.\n\n'
          )
          text = text.replace(marker, entry + marker, 1)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.381 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          js = Path('static/layout-options.js').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert 'MODES={auto:true,manual:true}' in js
          assert 'SAFE_EDGE_PX=40' in js
          assert 'viewportWidth-(SAFE_EDGE_PX*2)' in js
          assert 'var cardWidth=318*scale' in js
          assert 'var gap=14*scale' in js
          assert "window.getUpdateColumnCount=function(grid)" in js
          assert "if(readMode()!=='manual')return original(grid)" in js
          assert 'manual-active .settings-custom-select' in js
          assert 'value="110 %"' in js
          assert "return String(clampCustom(value))+' %'" in js
          assert '<option value="auto">Automatisch</option>' in js
          assert '<option value="manual">Manuell</option>' in js
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.381';" in html
          assert 'id="systemInfoVersion">v0.3.381</div>' in html
          PY

      - name: Commit synchronized v0.3.381
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.381 manual edge boundary"
          git push
