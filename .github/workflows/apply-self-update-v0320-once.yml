name: Apply self update v0.3.320 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-self-update-v0320-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix temporary frontend matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_self_update_v0320.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacement = r'''section_pattern = re.compile(r"async function installImageUpdate\(app,backupMode='none'\)\{.*?\n\}\n\nfunction formatMemory", re.S)'''
          matches = [i for i, line in enumerate(lines) if line.strip().startswith('section_pattern = re.compile(')]
          if len(matches) != 1:
              raise SystemExit(f'expected one section_pattern line, found {len(matches)}')
          lines[matches[0]] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Apply v0.3.320 self update handoff
        run: python .github/scripts/apply_self_update_v0320.py

      - name: Validate patched files
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('app/main.py').read_text(encoding='utf-8'))
          script = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == '_SELF_UPDATE_HELPER_SCRIPT':
                          script = ast.literal_eval(node.value)
          if not script:
              raise SystemExit('embedded helper script not found')
          compile(script, '<self-update-helper>', 'exec')
          print('embedded helper syntax OK')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/update-monitor-ui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/update-monitor-ui.js
          grep -q 'VERSION = "0.3.320"' app/main.py
          grep -q "UPDATE_MONITOR_VERSION = 'v0.3.320'" static/index.html
          grep -q 'version: "0.3.320"' docker-compose.zimaos.yml

      - name: Commit v0.3.320
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py static/index.html docker-compose.zimaos.yml README.md
          git diff --cached --quiet && exit 0
          git commit -m "Add safe self update handoff v0.3.320"
          git push
