          startup_anchor = '''    threading.Thread(target=scheduler_loop, name="update-monitor-scheduler", daemon=True).start()\n    threading.Thread(target=message_bus_listener_loop, name="update-monitor-message-bus", daemon=True).start()\n\n    for index, stack_key in enumerate(false_pin_stacks):\n'''
          startup_replacement = '''    threading.Thread(target=scheduler_loop, name="update-monitor-scheduler", daemon=True).start()\n    threading.Thread(target=message_bus_listener_loop, name="update-monitor-message-bus", daemon=True).start()\n    threading.Timer(1.0, reconcile_self_update_after_restart).start()\n\n    for index, stack_key in enumerate(false_pin_stacks):\n'''
          main = replace_once(main, startup_anchor, startup_replacement, 'startup self update reconciliation')

          # Default to Quick Backup for self update and disable Full Backup in
