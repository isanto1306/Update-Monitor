          new_section = r'''async function waitForSelfUpdateRestart(stackKey,previousStartedAt,timeoutMs=6*60*1000){
  const key=String(stackKey||'');
  if(!key)return false;
  const previous=String(previousStartedAt||'');
  const deadline=Date.now()+Math.max(30000,Number(timeoutMs)||0);
  let sawOffline=false;
  let restarted=false;

  while(Date.now()<deadline){
    const d=await loadStatus();
    if(!d){
      sawOffline=true;
      await new Promise(resolve=>setTimeout(resolve,1000));
      continue;
    }

    const startedAt=String(d&&d.service_runtime&&d.service_runtime.started_at||'');
    if(
      (previous&&startedAt&&startedAt!==previous)
      ||(!previous&&sawOffline&&startedAt)
    ){
      restarted=true;
    }

    if(restarted){
      const apps=(d.scan&&Array.isArray(d.scan.apps))?d.scan.apps:[];
      const refreshed=apps.find(candidate=>String(candidate&&candidate.stack_key||'')===key);
      const pending=state.pendingPostScans.has(key)||state.pendingPostScans.has('*');
      const active=matchingVerificationScan(d.scan,key)&&String(d.scan&&d.scan.state||'idle')==='scanning';
      if(appUpdateVerifiedCurrent(refreshed)&&!pending&&!active){
        state.verifyingApps.delete(key);
        state.verificationBaselines.delete(key);
        state.updateMessages.delete(key);
        render();
        return true;
      }
    }

    await new Promise(resolve=>setTimeout(resolve,1000));
  }

  state.verifyingApps.delete(key);
  state.verificationBaselines.delete(key);
  render();
  return false;
}

async function installImageUpdate(app,backupMode='none'){
  if(!app||!(app.can_image_update||app.can_version_update)||state.updatingApps.has(app.stack_key)||state.checkingApps.has(app.stack_key)||state.verifyingApps.has(app.stack_key))return;
  const stackKey=String(app.stack_key||'');
  const baselineFinishedAt=verificationBaseline();
  const selfUpdateStartedAt=String(state.serviceRuntime&&state.serviceRuntime.started_at||'');
  let verificationExpected=false;
  let verificationNeedsConfirmation=false;
  let deferredTransportError=null;
  let selfUpdateHandoff=false;

  state.updatingApps.add(stackKey);
  state.updateMessages.delete(stackKey);
  render();
  const normalizedBackupMode=['quick','full','none'].includes(String(backupMode||''))?String(backupMode):'none';
  startActionProgressPolling(stackKey,'update',normalizedBackupMode==='none'?'starting':'backup');

  try{
    const updateResult=await api('/api/app-update',{
      method:'POST',
      body:JSON.stringify({stack_key:stackKey,backup_mode:normalizedBackupMode})
    });
    if(updateResult&&updateResult.self_update_handoff){
      selfUpdateHandoff=true;
      beginVerificationState(stackKey,baselineFinishedAt);
      state.updateMessages.delete(stackKey);
    }else{
      beginVerificationState(stackKey,baselineFinishedAt);
      verificationExpected=true;
      state.updateMessages.delete(stackKey);
    }
  }catch(err){
    if(err.message!=='auth'){
      const transportFailure=isUpdateTransportFailure(err);

      // During a self update the server is expected to disappear briefly. A
      // transport loss can therefore be the handoff itself, even if the final
      // HTTP response was lost while ZimaOS replaced the container.
      if(transportFailure&&app.self_protected){
        selfUpdateHandoff=true;
        beginVerificationState(stackKey,baselineFinishedAt);
        state.updateMessages.delete(stackKey);
      }else if(transportFailure){
        deferredTransportError=String(err.message||'Failed to fetch');
        state.updateMessages.delete(stackKey);
        beginVerificationState(stackKey,baselineFinishedAt);
        verificationNeedsConfirmation=true;
      }else{
        state.updateMessages.set(
          stackKey,
          {ok:false,kind:'update',text:t('updateFailed').replace('{error}',err.message||'-')}
        );
        beginVerificationState(stackKey,baselineFinishedAt);
        verificationNeedsConfirmation=true;
      }
    }
  }finally{
    await finishActionProgressPolling(stackKey);
    state.updatingApps.delete(stackKey);
    state.actionProgress.delete(stackKey);
    render();
  }

  if(selfUpdateHandoff){
    const verified=await waitForSelfUpdateRestart(stackKey,selfUpdateStartedAt);
    if(!verified){
      state.updateMessages.set(
        stackKey,
        {
          ok:false,
          kind:'update',
          text:t('updateFailed').replace(
            '{error}',
            state.language==='en'
              ?'The self update could not be verified after the restart.'
              :'Das Selbst Update konnte nach dem Neustart nicht bestätigt werden.'
          )
        }
      );
      render();
    }
    return;
  }

  if(verificationNeedsConfirmation){
    const d=await loadStatus();
    const pending=state.pendingPostScans.has(stackKey)||state.pendingPostScans.has('*');
    const active=matchingVerificationScan(d&&d.scan,stackKey)
      &&String(d&&d.scan&&d.scan.state||'idle')==='scanning';
    if(pending||active){
      verificationExpected=true;
    }else{
      state.verifyingApps.delete(stackKey);
      state.verificationBaselines.delete(stackKey);

      const refreshedApps=(state.data&&Array.isArray(state.data.apps))
        ?state.data.apps
        :[];
      const refreshedApp=refreshedApps.find(
        candidate=>String(candidate&&candidate.stack_key||'')===stackKey
      );

      if(deferredTransportError&&appUpdateVerifiedCurrent(refreshedApp)){
        state.updateMessages.delete(stackKey);
      }else if(deferredTransportError){
        state.updateMessages.set(
          stackKey,
          {
            ok:false,
            kind:'update',
            text:t('updateFailed').replace('{error}',deferredTransportError)
          }
        );
      }

      render();
    }
  }

  if(verificationExpected){
    await waitForPostUpdateVerification(stackKey);
  }
}
