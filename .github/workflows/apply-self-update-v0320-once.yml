          schedule_anchor = '''    stack_key = str(stack_key or "").strip()\n    if not stack_key:\n        return False\n\n    requested_at = utc_now()\n'''
          schedule_replacement = '''    stack_key = str(stack_key or "").strip()\n    if not stack_key:\n        return False\n    if self_update_handoff_owned_by_current_process(stack_key):\n        return False\n\n    requested_at = utc_now()\n'''
          main = replace_once(main, schedule_anchor, schedule_replacement, 'old process scan suppression')

          # Reconcile the persisted handoff before the normal 3-second startup
