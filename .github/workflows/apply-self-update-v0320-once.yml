          preview_replacement = '''  const selfUpdate=!!app.self_protected;\n  document.querySelectorAll('[data-backup-preview-choice]').forEach(button=>{\n    const isFull=String(button.dataset.backupPreviewChoice||'')==='full';\n    button.disabled=selfUpdate&&isFull;\n    if(isFull){\n      button.title=selfUpdate\n        ?(state.language==='en'?'Full backup is unavailable while Update Monitor updates itself.':'Vollständiges Backup ist beim Selbst Update nicht verfügbar.')\n        :'';\n    }\n  });\n  setBackupPreviewChoice(selfUpdate?'quick':'full');\n  updateBackupPreviewRetentionText();'''
          ui = replace_once(ui, preview_anchor, preview_replacement, 'self update backup preview')

          section_pattern = re.compile(r"async function installImageUpdate\(app,backupMode='none'\)\{.*?\n\}\nfunction formatMemory", re.S)
          match = section_pattern.search(ui)
