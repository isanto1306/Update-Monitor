          backup_anchor = '''def create_pre_update_backup(app_item, mode, stack_key=None):\n    mode = _normalize_backup_mode(mode, "none")\n    if mode == "none":\n        return None\n'''
          backup_replacement = '''def create_pre_update_backup(app_item, mode, stack_key=None):\n    mode = _normalize_backup_mode(mode, "none")\n    if mode == "full" and is_update_monitor_self_app(app_item):\n        mode = "quick"\n    if mode == "none":\n        return None\n'''
          main = replace_once(main, backup_anchor, backup_replacement, 'self backup safety')

          # Route same-tag updates of Update Monitor through the helper. This is
          # deliberately inside the common function so manual and automatic self
          # updates use the same safe handoff.
          image_update_anchor = '''def perform_image_update(app_item):\n    """\n    Install same-tag updates such as :latest -> newer :latest.\n\n    The old path accepted a changed container/image ID as success. This path\n    instead verifies the actual remote digest before and after recreation.\n    """\n'''
          image_update_replacement = image_update_anchor + '''    if is_update_monitor_self_app(app_item):\n        return perform_self_image_update_handoff(app_item)\n\n'''
          main = replace_once(main, image_update_anchor, image_update_replacement, 'self image update dispatch')

          # Do not let the old process start a targeted scan in the few seconds
