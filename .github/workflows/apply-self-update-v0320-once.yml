name: Apply self update v0.3.320 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-self-update-v0320-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.3.320 self update handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('app/main.py')
          ui_path = Path('static/index.html')
          compose_path = Path('docker-compose.zimaos.yml')
          readme_path = Path('README.md')

          main = main_path.read_text(encoding='utf-8')
          ui = ui_path.read_text(encoding='utf-8')
          compose = compose_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          main = replace_once(main, 'VERSION = "0.3.319"', 'VERSION = "0.3.320"', 'backend version')
          ui = replace_once(ui, "const UPDATE_MONITOR_VERSION = 'v0.3.319';", "const UPDATE_MONITOR_VERSION = 'v0.3.320';", 'frontend version')
          compose = replace_once(compose, 'version: "0.3.319"', 'version: "0.3.320"', 'zima compose version')
          readme = replace_once(readme, 'Current release: **v0.3.319**', 'Current release: **v0.3.320**', 'readme version')

          main = replace_once(
              main,
              'PROJECT_LINK_CACHE = {}\n',
              'PROJECT_LINK_CACHE = {}\n\n# Persistent handoff state for updating Update Monitor itself. The actual\n# container recreation is performed by a short-lived helper so the updater is\n# not killed before it can hand control to the replacement container.\nSELF_UPDATE_STATE_FILE = CACHE_DIR / "self-update.json"\n',
              'self update state constant',
          )

          helper_code = r'''

def self_update_handoff_owned_by_current_process(stack_key=None):
    """True while this process is the old instance waiting to be replaced."""
    marker = load_json(SELF_UPDATE_STATE_FILE, {})
    if not isinstance(marker, dict) or marker.get("consumed_at"):
        return False

    requested_stack = str(stack_key or "").strip()
    marker_stack = str(marker.get("stack_key") or "").strip()
    if requested_stack and marker_stack and requested_stack != marker_stack:
        return False

    old_id = str(marker.get("old_container_id") or "").strip()
    if not old_id:
        return False
    current_id = str(
        update_monitor_self_identity().get("container_id") or ""
    ).strip()
    return bool(current_id and current_id == old_id)


_SELF_UPDATE_HELPER_SCRIPT = r'''\
import base64
import json
import os
import subprocess
import time
