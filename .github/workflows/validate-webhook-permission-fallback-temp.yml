name: Validate webhook permission fallback branch

on:
  push:
    branches:
      - fix-webhook-permission-fallback-v0370

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend syntax
        run: python3 -m py_compile app/main.py

      - name: Synchronize frontend
        run: python3 .github/scripts/sync_frontend.py

      - name: Validate webhook bridge JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          from pathlib import Path

          source = Path("app/main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          bridge = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(
                  isinstance(target, ast.Name)
                  and target.id == "_INDEX_WEBHOOK_AUTOMATION_BRIDGE"
                  for target in node.targets
              ):
                  bridge = ast.literal_eval(node.value)
                  break
          assert isinstance(bridge, str)
          assert 'um-webhook-automation-v0370' in bridge
          Path("/tmp/webhook-bridge.js").write_text(
              bridge.split(">", 1)[1].rsplit("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/webhook-bridge.js

      - name: Validate permission fallback behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          import re
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          tree = ast.parse(main)
          funcs = {
              node.name: ast.get_source_segment(main, node) or ""
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          assert 'VERSION = "0.3.370"' in main
          assert "_github_webhook_permission_fallback" in funcs
          fallback = funcs["_github_webhook_permission_fallback"]
          assert "resource not accessible by personal access token" in fallback
          assert "X-RateLimit-Remaining" in fallback
          sync = funcs["sync_github_webhooks"]
          assert "registry_fallback_permission" in sync
          public_status = funcs["github_webhook_public_status"]
          assert "permission_fallback_repositories" in public_status
          assert "permission_fallback_apps" in public_status
          assert "um-webhook-automation-v0370" in html
          assert "ohne Webhook Berechtigung" in html
          assert "Registry Prüfung" in html
          assert "Current release: **v0.3.370**" in Path("README.md").read_text(encoding="utf-8")
          assert 'version: "0.3.370"' in Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          print("webhook permission fallback validation passed")
          PY
