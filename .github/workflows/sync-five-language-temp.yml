name: Synchronize five language branch

on:
  push:
    branches:
      - restore-fr-pt-es-v0373

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize frontend and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- static/index.html translation-audit-current.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html translation-audit-current.json
          git commit -m "Synchronize five language frontend and audit"
          git push
