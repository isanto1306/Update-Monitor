name: One-time v0.3.391 digest-pin runtime reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0391.yml

permissions:
  contents: write

jobs:
  release-v0391:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconcile digest-pinned runtime and Compose state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p=Path("app/main.py")
          text=p.read_text(encoding="utf-8")

          # Version bump.
          if 'VERSION = "0.3.390"' not in text:
              raise SystemExit("Backend version marker missing")
          text=text.replace('VERSION = "0.3.390"','VERSION = "0.3.391"',1)

          # Semantic ref comparison: a digest pin is authoritative even if
          # ZimaOS/Docker normalizes away or changes the textual tag portion.
          parse_end='def parse_repo_digest(value):\n'
          pos=text.index(parse_end)
          helper='''def image_refs_semantically_equal(left, right):
    """Compare Docker image refs without making tag spelling outrank a digest pin."""
    left_value = str(left or "").strip()
    right_value = str(right or "").strip()
    if left_value == right_value:
        return True
    if not left_value or not right_value:
        return False

    a = parse_image_ref(left_value)
    b = parse_image_ref(right_value)
    if str(a.get("normalized_repo") or "") != str(b.get("normalized_repo") or ""):
        return False

    a_digest = str(a.get("pinned_digest") or "").strip().lower()
    b_digest = str(b.get("pinned_digest") or "").strip().lower()
    if a_digest and b_digest:
        return a_digest == b_digest

    # Without two immutable pins, keep normal tag semantics strict.
    return (
        not a_digest
        and not b_digest
        and str(a.get("tag") or "").strip().casefold()
        == str(b.get("tag") or "").strip().casefold()
    )


'''
          text=text[:pos]+helper+text[pos:]

          # Digest resolver: runtime/local digest wins. Compose pin is only a
          # fallback when Docker exposes no usable local RepoDigest.
          old='''        if digest_pinned:
            pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()
            if pinned_digest.startswith("sha256:"):
                local_digest_values.add(pinned_digest)

        local_digests = tuple(sorted(local_digest_values))
'''
          new='''        if digest_pinned and not local_digest_values:
            pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()
            if pinned_digest.startswith("sha256:"):
                local_digest_values.add(pinned_digest)

        local_digests = tuple(sorted(local_digest_values))
'''
          if text.count(old) != 1:
              raise SystemExit(f"Normal-scan digest fallback marker count={text.count(old)}")
          text=text.replace(old,new,1)

          old_picker='''        if digest_pinned:
            pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()
            if pinned_digest.startswith("sha256:"):
                local_digest_values.add(pinned_digest)
            if resolution_source in {"configured-tag", "local-repotag"}:
                resolved_installed = ""

        local_digests = sorted(local_digest_values)
'''
          new_picker='''        if digest_pinned:
            if not local_digest_values:
                pinned_digest = str(item.get("compose_pinned_digest") or "").strip().lower()
                if pinned_digest.startswith("sha256:"):
                    local_digest_values.add(pinned_digest)
            if resolution_source in {"configured-tag", "local-repotag"}:
                resolved_installed = ""

        local_digests = sorted(local_digest_values)
'''
          if old_picker not in text:
              raise SystemExit("Interactive digest fallback marker missing")
          text=text.replace(old_picker,new_picker,1)

          # Policy/UI: use the digest-resolved installed release before the stale
          # configured tag when deciding whether a manual target is a no-op.
          marker='''    current_aliases = {
        _version_alias(value)
        for value in ((group or {}).get("current_tags") or [])
        if _version_alias(value)
    }

    follow_tag_switch_only = False
'''
          replacement='''    current_aliases = {
        _version_alias(value)
        for value in ((group or {}).get("current_tags") or [])
        if _version_alias(value)
    }
    installed_version = _version_group_installed_tag(group) if group else None
    installed_alias = _version_alias(installed_version) if installed_version else None

    follow_tag_switch_only = False
'''
          if marker not in text:
              raise SystemExit("Policy alias marker missing")
          text=text.replace(marker,replacement,1)

          old_upgrade='''        elif mode == "upgrade" and target_tag in available_tags:
            # Manual selection may intentionally move backwards, but changing
            # to the version already configured for the whole family is a no-op.
            can_version_update = _version_alias(target_tag) not in current_aliases
'''
          new_upgrade='''        elif mode == "upgrade" and target_tag in available_tags:
            # Digest-resolved runtime state outranks a stale configured tag.
            # Manual selection may intentionally move backwards, but selecting
            # the version already running is always a no-op.
            target_alias = _version_alias(target_tag)
            can_version_update = (
                target_alias != installed_alias
                if installed_alias
                else target_alias not in current_aliases
            )
'''
          if old_upgrade not in text:
              raise SystemExit("Policy upgrade marker missing")
          text=text.replace(old_upgrade,new_upgrade,1)

          text=text.replace(
              '    app_item["installed_version"] = _version_group_installed_tag(group) if group else None\n',
              '    app_item["installed_version"] = installed_version\n',
              1,
          )

          # Race-safe manual path: if the digest already proves the selected
          # version, finish as a no-op instead of trying to rewrite/recreate it.
          guard='''    if mode == "upgrade":
        target_tag = str(policy.get("target_tag") or "").strip()
        available_tags = list((group.get("available") or {}).get("display_tags") or [])
        if not target_tag or target_tag not in available_tags:
            raise RuntimeError("The selected version is no longer available")
        target_map = _version_group_target_map(group, target_tag, "available")
'''
          guard_new='''    if mode == "upgrade":
        target_tag = str(policy.get("target_tag") or "").strip()
        available_tags = list((group.get("available") or {}).get("display_tags") or [])
        if not target_tag or target_tag not in available_tags:
            raise RuntimeError("The selected version is no longer available")

        installed_version = _version_group_installed_tag(group)
        if (
            installed_version
            and _version_alias(installed_version) == _version_alias(target_tag)
        ):
            save_monitor_policy(
                app_item.get("stack_key"),
                "fixed",
                None,
                auto_enabled=False,
            )
            return {
                "project": project,
                "target_tag": target_tag,
                "version_group": _public_version_group(group),
                "containers": [
                    str(container.get("name") or "").strip()
                    for item in group_items
                    for container in (item.get("containers") or [])
                    if str(container.get("name") or "").strip()
                ],
                "already_installed": True,
                "policy_after_update": get_monitor_policy(app_item.get("stack_key")),
                "engine": "digest-resolved-noop",
            }

        target_map = _version_group_target_map(group, target_tag, "available")
'''
          if guard not in text:
              raise SystemExit("Version-update upgrade guard missing")
          text=text.replace(guard,guard_new,1)

          # Persisted Compose verification accepts semantically equivalent
          # digest-pinned refs.
          old_cmp='''                if actual_ref != target_ref:
                    raise RuntimeError(
'''
          new_cmp='''                if not image_refs_semantically_equal(actual_ref, target_ref):
                    raise RuntimeError(
'''
          if old_cmp not in text:
              raise SystemExit("Persisted Compose equality marker missing")
          text=text.replace(old_cmp,new_cmp,1)

          # Waiter: parse saved service images instead of raw substring matching,
          # and accept semantic digest equivalence for runtime refs.
          old_wait='''        try:
            compose_text = casaos_compose_yaml(compose_project)
            compose_saved = all(ref in compose_text for ref in expected_refs)
        except Exception:
            compose_saved = False

        current_refs = {}
'''
          new_wait='''        try:
            compose_text = casaos_compose_yaml(compose_project)
            saved_images = compose_service_image_map_from_yaml(compose_text)
            saved_refs = list(saved_images.values())
            compose_saved = all(
                any(image_refs_semantically_equal(saved, expected) for saved in saved_refs)
                for expected in expected_refs
            )
        except Exception:
            compose_saved = False

        current_refs = {}
'''
          if old_wait not in text:
              raise SystemExit("Version-group Compose waiter marker missing")
          text=text.replace(old_wait,new_wait,1)

          old_ready='''                current_refs.get(name) == expected_ref
                for name, expected_ref in expected_by_container.items()
'''
          new_ready='''                image_refs_semantically_equal(current_refs.get(name), expected_ref)
                for name, expected_ref in expected_by_container.items()
'''
          if old_ready not in text:
              raise SystemExit("Version-group runtime equality marker missing")
          text=text.replace(old_ready,new_ready,1)

          old_runtime='''        if last_ref == image_ref and matched:
            return {
'''
          new_runtime='''        if image_refs_semantically_equal(last_ref, image_ref) and matched:
            return {
'''
          if old_runtime not in text:
              raise SystemExit("Runtime target equality marker missing")
          text=text.replace(old_runtime,new_runtime,1)

          p.write_text(text,encoding="utf-8")
          PY

      - name: Bump release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path,old,new):
              p=Path(path)
              text=p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing marker in {path}: {old!r}")
              p.write_text(text.replace(old,new,1),encoding="utf-8")

          replace_once("docker-compose.zimaos.yml",'  version: "0.3.390"','  version: "0.3.391"')
          replace_once("static/site.webmanifest","?v=0.3.390","?v=0.3.391")
          replace_once("static/site.webmanifest","?v=0.3.390","?v=0.3.391")
          replace_once("static/update-channel.js","um-update-channel-v0390","um-update-channel-v0391")
          replace_once(
              "Dockerfile",
              's.replace("/update-channel.js?v=0.3.390", "/update-channel.js?v=0.3.390-pindigestversion1", 1)',
              's.replace("/update-channel.js?v=0.3.391", "/update-channel.js?v=0.3.391-pindigestruntime1", 1)',
          )

          p=Path("README.md")
          text=p.read_text(encoding="utf-8")
          text=text.replace("Current release: **v0.3.390**","Current release: **v0.3.391**",1)
          marker="v0.3.390 fixes installed-version detection"
          pos=text.find(marker)
          if pos < 0:
              raise SystemExit("README v0.3.390 entry missing")
          entry=(
              "v0.3.391 reconciles digest-pinned apps against the live Docker runtime. "
              "A current runtime RepoDigest now wins over a stale cached/Compose digest; "
              "the Compose pin is used only as a fallback when Docker exposes no local digest. "
              "Manual version selection no longer starts a second update when the selected "
              "release is already proven by the running digest, and digest-pinned image refs "
              "are compared semantically so harmless ZimaOS/Docker normalization does not "
              "trigger a false rollback.\n\n"
          )
          p.write_text(text[:pos]+entry+text[pos:],encoding="utf-8")
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.391
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          py=Path("app/main.py").read_text(encoding="utf-8")
          html=Path("static/index.html").read_text(encoding="utf-8")
          compose=Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          dockerfile=Path("Dockerfile").read_text(encoding="utf-8")
          assert 'VERSION = "0.3.391"' in py
          assert "def image_refs_semantically_equal" in py
          assert "if digest_pinned and not local_digest_values:" in py
          assert '"already_installed": True' in py
          assert "digest-resolved-noop" in py
          assert "image_refs_semantically_equal(actual_ref, target_ref)" in py
          assert "image_refs_semantically_equal(last_ref, image_ref)" in py
          assert 'version: "0.3.391"' in compose
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.391';" in html
          assert 'id="systemInfoVersion">v0.3.391</div>' in html
          assert '/update-channel.js?v=0.3.391-pindigestruntime1' in dockerfile
          PY

      - name: Commit synchronized v0.3.391
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.391 reconcile digest-pinned runtime state"
          git pull --rebase origin main
          git push origin HEAD:main
