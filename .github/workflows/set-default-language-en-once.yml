name: Set default language English once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/set-default-language-en-once.yml'

permissions:
  contents: write

jobs:
  patch-language:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set English as default language for new users
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          old_lang = "language: localStorage.getItem('updateMonitorLanguage') === 'en' ? 'en' : 'de',"
          new_lang = "language: localStorage.getItem('updateMonitorLanguage') === 'de' ? 'de' : 'en',"
          old_ver = "const UPDATE_MONITOR_VERSION = 'v0.3.317';"
          new_ver = "const UPDATE_MONITOR_VERSION = 'v0.3.318';"

          if old_lang not in text:
              raise SystemExit('Expected language default line was not found.')
          if old_ver not in text:
              raise SystemExit('Expected frontend version marker was not found.')

          text = text.replace(old_lang, new_lang, 1)
          text = text.replace(old_ver, new_ver, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Default new installations to English"
          git push
