name: Check five language parity

on:
  push:
    branches:
      - restore-fr-pt-es-v0373

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend syntax
        run: python3 -m py_compile app/main.py
      - name: Synchronize frontend
        run: python3 .github/scripts/sync_frontend.py
      - name: Audit five languages
        run: python3 .github/scripts/audit_translations.py
