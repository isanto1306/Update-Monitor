name: Inspect current UI layout
on:
  push:
    branches: [inspect-ui-layout-20260919]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("static/index.html").read_text(encoding="utf-8")
          terms=[
            'renderImageSourceEntry(app)',
            'function renderAppCard',
            'data-image-source-open',
            'let imageSourceState=',
            '<div id="imageSourceBackdrop"',
            '#imageSourceBackdrop.visible,',
          ]
          for term in terms:
              print("\n###",term)
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  print("OFFSET",i)
                  print(s[max(0,i-1800):min(len(s),i+4200)])
                  start=i+len(term)
          PY
