name: Validate Update Monitor 0.3.355

on:
  push:
    branches:
      - fix-channel-source-0355
    paths:
      - '.github/workflows/validate-0355.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Apply 0.3.355 release markers and tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-channel-source-0355
          fetch-depth: 0

      - name: Patch release markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old,new,1)

          p=Path("static/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("?v=0.3.354","?v=0.3.355")
          s=s.replace(">v0.3.354<",">v0.3.355<")
          s=once(
              s,
              "const UPDATE_MONITOR_VERSION = 'v0.3.354';",
              "const UPDATE_MONITOR_VERSION = 'v0.3.355';",
              "frontend version",
          )
          p.write_text(s,encoding="utf-8")

          manifest=Path("static/site.webmanifest")
          m=manifest.read_text(encoding="utf-8").replace("?v=0.3.354","?v=0.3.355")
          manifest.write_text(m,encoding="utf-8")

          readme=Path("README.md")
          r=readme.read_text(encoding="utf-8")
          r=once(r,"Current release: **v0.3.354**","Current release: **v0.3.355**","README release")
          marker="Current release: **v0.3.355**\n"
          note=(
              "\nUpdate Kanal is now source-aware. Moving tags can be selected together "
              "with a verified image source, and an already active Docker/ZimaOS runtime "
              "alias is preferred over a conflicting Compose registry. This fixes channel "
              "changes such as Uptime Kuma from a GHCR fixed tag to the Docker Hub v2 channel.\n"
          )
          r=r.replace(marker,marker+note,1)
          readme.write_text(r,encoding="utf-8")

          compose=Path("docker-compose.zimaos.yml")
          c=compose.read_text(encoding="utf-8")
          c=once(c,'  version: "0.3.354"','  version: "0.3.355"',"Compose version")
          c=re.sub(r'(?m)^  update_at: "[^"]+"$','  update_at: "2026-09-19"',c,count=1)
          compose.write_text(c,encoding="utf-8")

          audit=Path("translation-audit-current.json")
          a=audit.read_text(encoding="utf-8")
          a=once(a,'"version": "v0.3.354"','"version": "v0.3.355"',"translation audit version")
          audit.write_text(a,encoding="utf-8")
          PY

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Backend compile and source-aware regression tests
        shell: bash
        env:
          UPDATE_MONITOR_USERNAME: test
          UPDATE_MONITOR_PASSWORD: test-password-12345
          UPDATE_MONITOR_SESSION_SECRET: test-session-secret-123456789012345678901234567890
          UPDATE_MONITOR_CACHE_DIR: /tmp/update-monitor-test
          UPDATE_MONITOR_SCAN_ON_START: "false"
        run: |
          python3 -m py_compile app/main.py
          python3 - <<'PY'
          import app.main as m

          assert m.VERSION == "0.3.355"

          item={
              "image_ref":"ghcr.io/louislam/uptime-kuma:2.5.4",
              "resolved_installed_tag":"2.5.4",
              "containers":[
                  {
                      "name":"uptime-kuma",
                      "compose_service":"app",
                      "state":"running",
                  }
              ],
          }
          app={
              "stack_key":"uptime-kuma-test",
              "name":"Uptime Kuma",
              "compose_project":"uptime-kuma",
              "items":[item],
          }

          originals={
              "_image_source_items":m._image_source_items,
              "_image_source_live_item":m._image_source_live_item,
              "_image_source_compose_configured_ref":m._image_source_compose_configured_ref,
              "_image_source_discover_sources":m._image_source_discover_sources,
              "docker_container_config_image":m.docker_container_config_image,
              "registry_tags":m.registry_tags,
          }

          try:
              m._image_source_items=lambda app_item:[item]
              m._image_source_live_item=lambda app_item,x,**kwargs:x
              m._image_source_compose_configured_ref=lambda app_item,x:"ghcr.io/louislam/uptime-kuma:2.5.4"
              m.docker_container_config_image=lambda name:"louislam/uptime-kuma:2"
              m._image_source_discover_sources=lambda app_item,x:(
                  x,
                  "linux/amd64",
                  [
                      {
                          "id":"ghcr",
                          "label_de":"GitHub Container Registry",
                          "label_en":"GitHub Container Registry",
                          "image_ref":"ghcr.io/louislam/uptime-kuma:2.5.4",
                          "compatibility_mode":"current",
                      },
                      {
                          "id":"dockerhub",
                          "label_de":"Docker Hub",
                          "label_en":"Docker Hub",
                          "image_ref":"louislam/uptime-kuma:2",
                          "compatibility_mode":"mirror",
                          "discovery_source":"active-runtime",
                      },
                  ],
                  [],
              )
              def tags(repo,max_pages=5):
                  if repo=="docker.io/louislam/uptime-kuma":
                      return ["2","next","beta","2.5.5","2.5.4"],None
                  if repo=="ghcr.io/louislam/uptime-kuma":
                      return ["2","next","beta","2.5.5","2.5.4"],None
                  return [],None
              m.registry_tags=tags

              data=m.image_channel_options_for_app(app)
              assert data["schema_version"] == 2
              options=data["images"][0]["options"]
              docker2=[
                  x for x in options
                  if x["source_id"]=="dockerhub" and x["tag"]=="2"
              ]
              assert docker2 and docker2[0]["target_image"]=="louislam/uptime-kuma:2"
              assert docker2[0]["source_is_runtime"] is True
              assert docker2[0]["can_apply"] is True

              ghcr2=[
                  x for x in options
                  if x["source_id"]=="ghcr" and x["tag"]=="2"
              ]
              assert ghcr2 and ghcr2[0]["target_image"]=="ghcr.io/louislam/uptime-kuma:2"
              assert ghcr2[0]["source_is_runtime"] is False

              # Runtime source is sorted first so the frontend's defaultChoice
              # can prefer Docker Hub :2 in the reproduced Uptime Kuma case.
              assert options.index(docker2[0]) < options.index(ghcr2[0])
          finally:
              for name,value in originals.items():
                  setattr(m,name,value)

          # Reproduce active-runtime discovery independently.
          original_compose=m._image_source_compose_configured_ref
          original_platform=m._image_source_current_platform
          original_project=m._image_source_github_project_url
          original_curated=m._image_source_curated_sources
          original_auto=m._image_source_auto_candidates
          original_config=m.docker_container_config_image
          try:
              m.IMAGE_SOURCE_DISCOVERY_CACHE.clear()
              m._image_source_compose_configured_ref=lambda app_item,x:"ghcr.io/louislam/uptime-kuma:2.5.4"
              m._image_source_current_platform=lambda:"linux/amd64"
              m._image_source_github_project_url=lambda app_item,x,ref:"https://github.com/louislam/uptime-kuma"
              m._image_source_curated_sources=lambda app_item,ref:[]
              m._image_source_auto_candidates=lambda app_item,x,ref,platform:[]
              m.docker_container_config_image=lambda name:"louislam/uptime-kuma:2"
              _,_,sources,_=m._image_source_discover_sources(app,item)
              runtime=[x for x in sources if x.get("discovery_source")=="active-runtime"]
              assert runtime
              assert runtime[0]["image_ref"]=="louislam/uptime-kuma:2"
              assert runtime[0]["compatibility_mode"]=="mirror"
          finally:
              m._image_source_compose_configured_ref=original_compose
              m._image_source_current_platform=original_platform
              m._image_source_github_project_url=original_project
              m._image_source_curated_sources=original_curated
              m._image_source_auto_candidates=original_auto
              m.docker_container_config_image=original_config
              m.IMAGE_SOURCE_DISCOVERY_CACHE.clear()

          source=open("app/main.py",encoding="utf-8").read()
          assert "source_id: Optional[str] = None" in source
          channel=source[source.index("def perform_image_channel_switch"):source.index("def perform_image_source_switch")]
          assert "source_id=None" in channel
          assert "build_image_source_option(" in channel
          assert 'source_option.get("level") != "ok"' in channel
          assert 'target_ref = f"{target_repo_text}:{target_tag}"' in channel
          print("Source-aware Update Kanal backend regression checks OK")
          PY

      - name: Frontend source-aware regression tests
        shell: bash
        run: |
          node --check static/update-channel.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path("static/update-channel.js").read_text(encoding="utf-8")
          assert "um-update-channel-v0355" in s
          assert "options[i].option_id" in s
          assert "source_is_runtime&&options[r].can_apply" in s
          assert "option.source_label||option.source_repository" in s
          assert "source_id:String(selected.source_id||'')||null" in s
          assert "Image Quelle und Update Kanal gemeinsam geändert" in s
          # Frozen details line rule remains unchanged.
          assert ".update-channel-entry{margin-top:10px;padding-top:10px;border-top:0;}" in s
          print("Source-aware Update Kanal frontend regression checks OK")
          PY

      - name: Version audit and diff check
        shell: bash
        run: |
          grep -n 'VERSION = "0.3.355"' app/main.py
          grep -n "UPDATE_MONITOR_VERSION = 'v0.3.355'" static/index.html
          grep -n '/update-channel.js?v=0.3.355' static/index.html
          grep -n 'version: "0.3.355"' docker-compose.zimaos.yml
          grep -n '"version": "v0.3.355"' translation-audit-current.json
          grep -n 'Current release: \*\*v0.3.355\*\*' README.md
          grep -n 'v=0.3.355' static/site.webmanifest
          git diff --check

      - name: Commit release markers
        shell: bash
        run: |
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html static/site.webmanifest README.md docker-compose.zimaos.yml translation-audit-current.json
          git commit -m "Complete source-aware Update Kanal v0.3.355"
          git push origin HEAD:fix-channel-source-0355
