name: Validate five language error localization

on:
  push:
    branches:
      - restore-fr-pt-es-v0373

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend and synchronized frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate error localization behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          from pathlib import Path

          source=Path("app/main.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          bridge=None
          for node in tree.body:
              if not isinstance(node,ast.Assign):
                  continue
              if any(isinstance(target,ast.Name) and target.id=="_INDEX_ERROR_LOCALIZATION_BRIDGE" for target in node.targets):
                  bridge=ast.literal_eval(node.value)
                  break
          assert isinstance(bridge,str)
          assert 'um-error-localization-v0373' in bridge
          js=bridge.split(">",1)[1].rsplit("</script>",1)[0]

          prelude="""
          global.window=global;
          global.state={language:'en'};
          global.api=async function(){throw new Error('Wait until the current update check is finished');};
          """
          tests=r"""
          (async()=>{
            const expected={
              de:'Warte, bis die aktuelle Update Prüfung abgeschlossen ist.',
              en:'Wait until the current update check is finished',
              fr:'Attendez la fin de la vérification actuelle des mises à jour.',
              pt:'Aguarde até terminar a verificação de atualizações atual.',
              es:'Espera a que finalice la comprobación de actualizaciones actual.'
            };
            const generic={
              de:'Technischer Fehler bei der angeforderten Aktion.',
              fr:'Erreur technique lors de l’action demandée.',
              pt:'Erro técnico ao executar a ação solicitada.',
              es:'Error técnico al realizar la acción solicitada.'
            };
            for(const code of ['de','en','fr','pt','es']){
              state.language=code;
              const actual=window.updateMonitorLocalizeBackendMessage(
                'Wait until the current update check is finished'
              );
              if(actual!==expected[code]){
                throw new Error(code+' scan lock mismatch: '+actual);
              }
              const unknown=window.updateMonitorLocalizeBackendMessage(
                'Completely unknown backend sentence'
              );
              if(code==='en'){
                if(unknown!=='Completely unknown backend sentence'){
                  throw new Error('English passthrough failed: '+unknown);
                }
              }else if(unknown!==generic[code]){
                throw new Error(code+' generic fallback mismatch: '+unknown);
              }
            }

            for(const code of ['de','fr','pt','es']){
              state.language=code;
              let message='';
              try{await api('/api/test');}catch(error){message=String(error.message||'');}
              if(message!==expected[code]){
                throw new Error(code+' API wrapper mismatch: '+message);
              }
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          """
          Path("/tmp/error-localization-five-languages.js").write_text(
              prelude+"\n"+js+"\n"+tests,
              encoding="utf-8"
          )
          PY
          node --check /tmp/error-localization-five-languages.js
          node /tmp/error-localization-five-languages.js

      - name: Validate dictionaries and release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          audit=json.loads(Path("translation-audit-current.json").read_text(encoding="utf-8"))
          html=Path("static/index.html").read_text(encoding="utf-8")
          readme=Path("README.md").read_text(encoding="utf-8")
          compose=Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")

          assert audit["version"]=="v0.3.373"
          assert audit["languages"]==["de","en","fr","pt","es"]
          assert audit["translation_keys"]==335
          assert audit["dictionary_parity"]=="ok"
          assert audit["placeholder_parity"]=="ok"
          assert audit["translations"]["pt"]["running"]=="Ativo"
          assert audit["translations"]["es"]["running"]=="Activo"
          assert audit["translations"]["fr"]["policySaveFailed"]=="Impossible d’enregistrer la politique : {error}"
          assert 'value="fr"' in html
          assert 'value="pt"' in html
          assert 'value="es"' in html
          assert "um-error-localization-v0373" in html
          assert "Current release: **v0.3.373**" in readme
          assert 'version: "0.3.373"' in compose
          print("five language localization validation passed")
          PY
