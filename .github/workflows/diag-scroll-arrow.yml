name: Temporary scroll arrow diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diag-scroll-arrow.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find bottom-right arrow candidates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          for path in [Path('static/index.html'), Path('static/update-channel.js'), Path('static/layout-options.js')]:
              text = path.read_text(encoding='utf-8', errors='ignore')
              low = text.lower()
              print(f'=== {path} ===')
              shown = set()
              for needle in ['position:fixed','position: fixed','scrolltop','scroll-top','scrolltotop','backtotop','chevron-up','arrow-up','caret-up','▲','⌃']:
                  start = 0
                  count = 0
                  while count < 30:
                      pos = low.find(needle.lower(), start)
                      if pos < 0:
                          break
                      left = max(0, pos-500)
                      right = min(len(text), pos+900)
                      snippet = ' '.join(text[left:right].split())
                      key = snippet[:220]
                      if key not in shown:
                          shown.add(key)
                          print(f'[{needle} @ {pos}] {snippet[:1400]}')
                      start = pos + max(1, len(needle))
                      count += 1
          PY
