name: Version sync v0.3.347

on:
  push:
    branches:
      - version-v0.3.347
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-v0.3.347
          fetch-depth: 0

      - name: Synchronize current release markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'app/main.py': [
                  ('VERSION = "0.3.346"', 'VERSION = "0.3.347"'),
              ],
              'README.md': [
                  ('Current release: **v0.3.345**', 'Current release: **v0.3.347**'),
              ],
              'docker-compose.zimaos.yml': [
                  ('version: "0.3.345"', 'version: "0.3.347"'),
                  ('update_at: "2026-09-16"', 'update_at: "2026-09-17"'),
              ],
              'static/site.webmanifest': [
                  ('?v=0.3.316', '?v=0.3.347'),
              ],
              'static/index.html': [
                  ('favicon.ico?v=0.3.345', 'favicon.ico?v=0.3.347'),
                  ('favicon-16x16.png?v=0.3.345', 'favicon-16x16.png?v=0.3.347'),
                  ('favicon-32x32.png?v=0.3.345', 'favicon-32x32.png?v=0.3.347'),
                  ('apple-touch-icon.png?v=0.3.345', 'apple-touch-icon.png?v=0.3.347'),
                  ('site.webmanifest?v=0.3.345', 'site.webmanifest?v=0.3.347'),
                  ('id="systemInfoVersion">v0.3.345<', 'id="systemInfoVersion">v0.3.347<'),
                  ("const UPDATE_MONITOR_VERSION = 'v0.3.345';", "const UPDATE_MONITOR_VERSION = 'v0.3.347';"),
              ],
              'translation-audit-current.json': [
                  ('"version": "v0.3.322"', '"version": "v0.3.347"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      if new in text:
                          continue
                      raise SystemExit(f'Missing expected version marker in {filename}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Validate release markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/main.py': ['VERSION = "0.3.347"'],
              'README.md': ['Current release: **v0.3.347**'],
              'docker-compose.zimaos.yml': ['version: "0.3.347"', 'update_at: "2026-09-17"'],
              'static/site.webmanifest': ['?v=0.3.347'],
              'static/index.html': [
                  'favicon.ico?v=0.3.347',
                  'favicon-16x16.png?v=0.3.347',
                  'favicon-32x32.png?v=0.3.347',
                  'apple-touch-icon.png?v=0.3.347',
                  'site.webmanifest?v=0.3.347',
                  'id="systemInfoVersion">v0.3.347<',
                  "const UPDATE_MONITOR_VERSION = 'v0.3.347';",
              ],
              'translation-audit-current.json': ['"version": "v0.3.347"'],
          }
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'Validation failed: {filename}: {marker}')
          print('All current release markers are v0.3.347')
          PY
          python3 -m py_compile app/main.py
          git diff --check

      - name: Commit synchronized version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py README.md docker-compose.zimaos.yml static/index.html static/site.webmanifest translation-audit-current.json
          if git diff --cached --quiet; then
            echo "Version markers already synchronized"
          else
            git commit -m "Synchronize v0.3.347 version markers"
            git push origin version-v0.3.347
          fi
