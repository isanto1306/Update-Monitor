name: One-time v0.3.387 synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-v0387.yml

permissions:
  contents: write

jobs:
  synchronize-v0387:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move back-to-top arrow another 1.5 pixels right
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('static/index.html')
          text = p.read_text(encoding='utf-8')

          desktop_pattern = re.compile(
              r'(#umScrollTopButtonV03251\s*\{\s*position\s*:\s*fixed\s*;\s*right\s*:\s*)12px\s*;'
          )
          text, desktop_count = desktop_pattern.subn(r'\g<1>10.5px;', text, count=1)
          if desktop_count != 1:
              raise SystemExit(f'Desktop scroll-top offset replacements: {desktop_count}')

          mobile_pattern = re.compile(
              r'(#umScrollTopButtonV03251\s*\{\s*right\s*:\s*)9px(\s*;\s*bottom\s*:\s*15px\s*;\s*width\s*:\s*27px\s*;\s*height\s*:\s*27px\s*;\s*\})'
          )
          text, mobile_count = mobile_pattern.subn(r'\g<1>7.5px\g<2>', text, count=1)
          if mobile_count != 1:
              raise SystemExit(f'Mobile scroll-top offset replacements: {mobile_count}')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Bump release markers to v0.3.387
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected marker in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('app/main.py', 'VERSION = "0.3.386"', 'VERSION = "0.3.387"')
          replace_exact('docker-compose.zimaos.yml', '  version: "0.3.386"', '  version: "0.3.387"')
          replace_exact('static/site.webmanifest', '?v=0.3.386', '?v=0.3.387')
          replace_exact('static/update-channel.js', 'um-update-channel-v0386', 'um-update-channel-v0387')
          replace_exact(
              'Dockerfile',
              's.replace("/update-channel.js?v=0.3.386", "/update-channel.js?v=0.3.386-arrow1", 1)',
              's.replace("/update-channel.js?v=0.3.387", "/update-channel.js?v=0.3.387-arrow2", 1)',
          )

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if 'Current release: **v0.3.386**' not in text:
              raise SystemExit('README current release marker missing')
          text = text.replace('Current release: **v0.3.386**', 'Current release: **v0.3.387**', 1)
          marker = 'v0.3.386 moves the fixed back-to-top arrow 4 px farther toward the right viewport edge'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit('README v0.3.386 marker missing')
          entry = (
              'v0.3.387 moves the fixed back-to-top arrow another 1.5 px toward the right viewport edge. '
              'Desktop right offset is now 10.5 px and the mobile override is 7.5 px. '
              'The Docker publish workflow also makes numbered release images immutable and serializes publish attempts, '
              'preventing ordinary repository commits from rebuilding the same version and creating repeated self-update prompts.\n\n'
          )
          text = text[:marker_pos] + entry + text[marker_pos:]
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize generated frontend and translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py
          python3 .github/scripts/audit_translations.py

      - name: Validate v0.3.387 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py
          node --check static/layout-options.js
          node --check static/update-channel.js
          python3 <<'PY'
          from pathlib import Path
          import re

          py = Path('app/main.py').read_text(encoding='utf-8')
          html = Path('static/index.html').read_text(encoding='utf-8')
          dockerfile = Path('Dockerfile').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/publish-ghcr.yml').read_text(encoding='utf-8')

          assert 'VERSION = "0.3.387"' in py
          assert re.search(r'#umScrollTopButtonV03251\s*\{\s*position\s*:\s*fixed\s*;\s*right\s*:\s*10\.5px\s*;', html)
          assert re.search(r'#umScrollTopButtonV03251\s*\{\s*right\s*:\s*7\.5px\s*;\s*bottom\s*:\s*15px\s*;', html)
          assert not re.search(r'#umScrollTopButtonV03251\s*\{\s*position\s*:\s*fixed\s*;\s*right\s*:\s*12px\s*;', html)
          assert "const UPDATE_MONITOR_VERSION = 'v0.3.387';" in html
          assert 'id="systemInfoVersion">v0.3.387</div>' in html
          assert '/update-channel.js?v=0.3.387-arrow2' in dockerfile
          assert 'Protect immutable release image' in workflow
          assert 'concurrency:' in workflow
          PY

      - name: Commit synchronized v0.3.387
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py docker-compose.zimaos.yml README.md static/site.webmanifest static/update-channel.js static/index.html translation-audit-current.json Dockerfile
          git commit -m "Release v0.3.387 finalize scroll arrow spacing"
          git pull --rebase origin main
          git push origin HEAD:main
