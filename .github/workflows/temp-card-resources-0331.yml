name: Temporary card resources v0.3.331

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-card-resources-0331.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/card_resources_0331.py

      - name: Validate
        shell: bash
        run: |
          python -m py_compile app/main.py
          python -c "from pathlib import Path; import re; h=Path('static/index.html').read_text(); s=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', h, re.S|re.I); Path('/tmp/update-monitor.js').write_text('\\n;\\n'.join(s)); assert \"const UPDATE_MONITOR_VERSION = 'v0.3.331';\" in h; assert 'CPU / RAM' in h; assert 'ports.slice(0,2)' in h"
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/temp-card-resources-0331.yml .github/card_resources_0331.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show live CPU RAM and compact ports v0.3.331"
          git push origin HEAD:main
