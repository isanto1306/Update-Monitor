name: Validate Update Monitor 0.3.354

on:
  push:
    branches:
      - fix-channel-registry-alias-0354
    paths:
      - '.github/workflows/validate-0354.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Apply 0.3.354 release markers and tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-channel-registry-alias-0354
          fetch-depth: 0

      - name: Patch release markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old,new,1)

          p=Path("static/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("?v=0.3.353","?v=0.3.354")
          s=s.replace(">v0.3.353<",">v0.3.354<")
          s=once(
              s,
              "const UPDATE_MONITOR_VERSION = 'v0.3.353';",
              "const UPDATE_MONITOR_VERSION = 'v0.3.354';",
              "frontend version",
          )
          p.write_text(s,encoding="utf-8")

          channel=Path("static/update-channel.js")
          ch=channel.read_text(encoding="utf-8")
          ch=ch.replace("um-update-channel-v0353","um-update-channel-v0354")
          channel.write_text(ch,encoding="utf-8")

          manifest=Path("static/site.webmanifest")
          m=manifest.read_text(encoding="utf-8").replace("?v=0.3.353","?v=0.3.354")
          manifest.write_text(m,encoding="utf-8")

          readme=Path("README.md")
          r=readme.read_text(encoding="utf-8")
          r=once(r,"Current release: **v0.3.353**","Current release: **v0.3.354**","README release")
          marker="Current release: **v0.3.354**\n"
          note=(
              "\nRegistry alias verification now accepts an exact Docker image ID match "
              "when Docker Hub and GHCR expose different RepoDigests for the same image. "
              "This prevents a successful Update Kanal change from being rolled back only "
              "because ZimaOS/Docker activates the equivalent registry alias.\n"
          )
          r=r.replace(marker,marker+note,1)
          readme.write_text(r,encoding="utf-8")

          compose=Path("docker-compose.zimaos.yml")
          c=compose.read_text(encoding="utf-8")
          c=once(c,'  version: "0.3.353"','  version: "0.3.354"',"Compose version")
          c=re.sub(r'(?m)^  update_at: "[^"]+"$','  update_at: "2026-09-19"',c,count=1)
          compose.write_text(c,encoding="utf-8")

          audit=Path("translation-audit-current.json")
          a=audit.read_text(encoding="utf-8")
          a=once(a,'"version": "v0.3.353"','"version": "v0.3.354"',"translation audit version")
          audit.write_text(a,encoding="utf-8")
          PY

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile and registry alias regression test
        shell: bash
        env:
          UPDATE_MONITOR_USERNAME: test
          UPDATE_MONITOR_PASSWORD: test-password-12345
          UPDATE_MONITOR_SESSION_SECRET: test-session-secret-123456789012345678901234567890
          UPDATE_MONITOR_CACHE_DIR: /tmp/update-monitor-test
          UPDATE_MONITOR_SCAN_ON_START: "false"
        run: |
          python3 -m py_compile app/main.py
          python3 - <<'PY'
          import app.main as m

          assert m.VERSION == "0.3.354"

          original_repo = m.docker_container_repo_digests
          original_id = m.docker_container_image_id
          try:
              # Reproduce the Uptime Kuma case: registry-scoped manifest digest
              # differs, but Docker is running the exact image we pulled.
              m.docker_container_repo_digests = (
                  lambda container, repo=None: {"sha256:dockerhub-manifest"}
              )
              m.docker_container_image_id = lambda container: "sha256:same-config-image"

              matched, local = m.container_matches_target_digest(
                  "uptime-kuma",
                  "ghcr.io/louislam/uptime-kuma:2",
                  {"sha256:ghcr-manifest"},
                  expected_image_id="sha256:same-config-image",
              )
              assert matched is True
              assert local == {"sha256:dockerhub-manifest"}

              matched, _ = m.container_matches_target_digest(
                  "uptime-kuma",
                  "ghcr.io/louislam/uptime-kuma:2",
                  {"sha256:ghcr-manifest"},
                  expected_image_id="sha256:different-config-image",
              )
              assert matched is False
          finally:
              m.docker_container_repo_digests = original_repo
              m.docker_container_image_id = original_id

          source=open("app/main.py",encoding="utf-8").read()
          channel=source[source.index("def perform_image_channel_switch"):source.index("def perform_image_source_switch")]
          assert "allow_forced_recreate=False" in channel
          assert "expected_image_id=expected_image_id" in channel
          print("Registry alias image-ID verification regression checks OK")
          PY

      - name: Frontend and version audit
        shell: bash
        run: |
          node --check static/update-channel.js
          grep -n 'VERSION = "0.3.354"' app/main.py
          grep -n "UPDATE_MONITOR_VERSION = 'v0.3.354'" static/index.html
          grep -n '/update-channel.js?v=0.3.354' static/index.html
          grep -n 'version: "0.3.354"' docker-compose.zimaos.yml
          grep -n '"version": "v0.3.354"' translation-audit-current.json
          grep -n 'Current release: \*\*v0.3.354\*\*' README.md
          grep -n 'v=0.3.354' static/site.webmanifest
          git diff --check

      - name: Commit release markers
        shell: bash
        run: |
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html static/update-channel.js static/site.webmanifest README.md docker-compose.zimaos.yml translation-audit-current.json
          git commit -m "Complete registry alias verification v0.3.354"
          git push origin HEAD:fix-channel-registry-alias-0354
