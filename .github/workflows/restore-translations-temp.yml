name: Restore historical translations payload

on:
  push:
    branches:
      - restore-fr-pt-es-v0373

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode historical translation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import subprocess
          import zlib
          from pathlib import Path

          ref = "939d2b412cfaccb57a35bbde319449e581509882"
          parts = []
          for index in range(1, 5):
              path = f".github/tmp/patcher323.part{index}"
              data = subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"],
                  text=True,
              ).strip()
              parts.append(data)

          packed = base64.b64decode("".join(parts))
          try:
              decoded = zlib.decompress(packed).decode("utf-8")
          except zlib.error:
              decoded = zlib.decompress(packed, -zlib.MAX_WBITS).decode("utf-8")

          out = Path(".github/tmp/restored-translation-patcher-v0323.py")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(decoded, encoding="utf-8")
          print(decoded[:1200])
          print(f"decoded length={len(decoded)}")
          PY

      - name: Commit extracted historical patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/restored-translation-patcher-v0323.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract historical FR PT ES translations"
          git push
