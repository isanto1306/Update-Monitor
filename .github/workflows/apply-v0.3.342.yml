# validation rerun 3
name: Apply Update Monitor v0.3.342 fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v0.3.342.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode patch script
        run: |
          base64 -d .github/patch-v0.3.342.py.gz.b64 | gzip -dc > /tmp/patch-v0.3.342.py

      - name: Adapt backup anchor to current v0.3.341
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/patch-v0.3.342.py')
          s = p.read_text(encoding='utf-8')
          start_marker = "old_manual_backup = '''"
          end_marker = 'main = replace_once(main, old_manual_backup, new_manual_backup, "manual auto backup rule")'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('manual auto backup patch block not found')
          end += len(end_marker)
          replacement = '''old_manual_backup = \'\'\'    requested_backup_mode = str(data.backup_mode or "none").strip().lower()
              if requested_backup_mode not in {"none", "quick", "full"}:
                  app_update_lock.release()
                  raise HTTPException(status_code=400, detail="Invalid backup mode")
              backup_mode = _normalize_backup_mode(requested_backup_mode, "none")\'\'\'
          new_manual_backup = \'\'\'    requested_backup_mode = str(data.backup_mode or "none").strip().lower()
              if requested_backup_mode not in {"none", "quick", "full"}:
                  app_update_lock.release()
                  raise HTTPException(status_code=400, detail="Invalid backup mode")

              # If this app is already configured for automatic updating, the user has
              # already chosen the backup rule. A faster manual click must use exactly
              # that saved rule instead of opening/accepting a second backup decision.
              auto_policy = get_monitor_policy(data.stack_key)
              auto_rule_applies = bool(auto_policy.get("auto_enabled")) and str(
                  auto_policy.get("mode") or ""
              ) in {"upgrade", "follow"}
              if auto_rule_applies:
                  backup_mode = _normalize_backup_mode(auto_policy.get("auto_backup_mode"), "none")
              else:
                  backup_mode = _normalize_backup_mode(requested_backup_mode, "none")\'\'\'
          main = replace_once(main, old_manual_backup, new_manual_backup, "manual auto backup rule")'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY
          python -m py_compile /tmp/patch-v0.3.342.py

      - name: Upload decoded patch script
        uses: actions/upload-artifact@v4
        with:
          name: patch-v0.3.342-script
          path: /tmp/patch-v0.3.342.py

      - name: Apply and validate v0.3.342
        id: patch
        run: |
          set -o pipefail
          python /tmp/patch-v0.3.342.py 2>&1 | tee /tmp/patch-v0.3.342.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-v0.3.342-diagnostics
          path: /tmp/patch-v0.3.342.log

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'VERSION = "0.3.342"' app/main.py
          grep -q "const UPDATE_MONITOR_VERSION = 'v0.3.342';" static/index.html

      - name: Commit validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch-v0.3.342.py.gz.b64 .github/workflows/apply-v0.3.342.yml
          git add app/main.py static/index.html docker-compose.zimaos.yml docker-compose.yml .env.example README.md .github/patch-v0.3.342.py.gz.b64 .github/workflows/apply-v0.3.342.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Fix update safety and backup handling v0.3.342"
          git push origin HEAD:main
