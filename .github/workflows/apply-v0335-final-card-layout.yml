name: Apply v0.3.335 final card layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0335-final-card-layout.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.3.335 source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          OLD_VERSION = '0.3.334'
          NEW_VERSION = '0.3.335'

          index_path = Path('static/index.html')
          main_path = Path('app/main.py')
          readme_path = Path('README.md')

          index = index_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')

          # Final three-column card geometry. Percentages are intentionally hidden
          # so CPU/RAM bars get the available width. Container and Port icons use
          # the same top-row alignment principle as CPU/RAM.
          style_pattern = re.compile(r'<style id="um-card-resource-port-v0334">.*?</style>', re.S)
          style_replacement = r'''<style id="um-card-resource-port-v0335">
          /* v0.3.335 — final fixed card geometry based on the supplied reference. */
          .update-card-summary > .update-card-stats{
            height:94px !important;
            min-height:94px !important;
            max-height:94px !important;
            display:grid !important;
            grid-template-columns:minmax(86px,.92fr) minmax(144px,1.5fr) minmax(86px,.92fr) !important;
            align-items:stretch !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat{
            position:relative !important;
            min-width:0 !important;
            min-height:74px !important;
            box-sizing:border-box !important;
          }

          /* Container: icon beside the heading, value below. */
          .update-card-summary > .update-card-stats > .update-card-stat:first-child{
            --status-band-icon:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%207l8-4%208%204-8%204-8-4Z%22%2F%3E%3Cpath%20d%3D%22M4%207v10l8%204%208-4V7M12%2011v10%22%2F%3E%3C%2Fsvg%3E") !important;
            display:flex !important;
            flex-direction:column !important;
            justify-content:flex-start !important;
            padding:9px 7px 7px 36px !important;
            overflow:hidden !important;
            text-align:left !important;
            contain:layout paint !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat:first-child::before{
            left:8px !important;
            top:10px !important;
            width:22px !important;
            height:22px !important;
            transform:none !important;
            background:#69adff !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat:first-child .update-card-stat-label{
            width:100% !important;
            margin:0 0 7px !important;
            padding:0 !important;
            text-align:left !important;
            white-space:nowrap !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat:first-child .update-card-stat-value{
            width:100% !important;
            min-width:0 !important;
            margin:0 !important;
            padding:0 !important;
            text-align:left !important;
            white-space:nowrap !important;
          }

          /* CPU / RAM: chip + title on top, two full-width rows below. */
          .update-card-summary > .update-card-stats > .update-card-stat-resource{
            --status-band-icon:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%227%22%20y%3D%227%22%20width%3D%2210%22%20height%3D%2210%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M9%201v3m6-3v3M9%2020v3m6-3v3M20%209h3m-3%206h3M1%209h3m-3%206h3%22%2F%3E%3C%2Fsvg%3E") !important;
            display:grid !important;
            grid-template-columns:27px minmax(0,1fr) !important;
            grid-template-rows:27px minmax(0,1fr) !important;
            column-gap:6px !important;
            row-gap:2px !important;
            align-content:center !important;
            padding:8px 8px 7px !important;
            overflow:visible !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat-resource::before{
            position:relative !important;
            left:auto !important;
            top:auto !important;
            grid-column:1 !important;
            grid-row:1 !important;
            align-self:center !important;
            justify-self:center !important;
            width:24px !important;
            height:24px !important;
            transform:none !important;
            background:#69adff !important;
          }
          .update-card-stat-resource .update-resource-title{
            grid-column:2 !important;
            grid-row:1 !important;
            align-self:center !important;
            min-width:0 !important;
            margin:0 !important;
            padding:0 !important;
            color:#69adff !important;
            font-size:12px !important;
            font-weight:500 !important;
            line-height:1.05 !important;
            text-align:left !important;
            white-space:nowrap !important;
          }
          .update-resource-bars{
            grid-column:1 / -1 !important;
            grid-row:2 !important;
            align-self:center !important;
            width:100% !important;
            min-width:0 !important;
            display:flex !important;
            flex-direction:column !important;
            gap:7px !important;
          }
          .update-resource-row{
            position:relative !important;
            width:100% !important;
            min-width:0 !important;
            min-height:13px !important;
            display:grid !important;
            grid-template-columns:34px minmax(0,1fr) !important;
            align-items:center !important;
            column-gap:6px !important;
          }
          .update-resource-name{
            min-width:0 !important;
            color:#72afff !important;
            font-size:11px !important;
            font-weight:500 !important;
            line-height:1 !important;
            white-space:nowrap !important;
          }
          .update-resource-track{
            display:block !important;
            width:100% !important;
            min-width:0 !important;
            height:13px !important;
            overflow:hidden !important;
            border-radius:4px !important;
            background:#22313e !important;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.015) !important;
          }
          .update-resource-fill{
            display:block !important;
            height:100% !important;
            min-width:0 !important;
            border-radius:inherit !important;
            background:linear-gradient(90deg,#6eaaff 0%,#76b7ff 100%) !important;
            transition:width .22s ease !important;
          }
          .update-resource-percent{
            display:none !important;
          }
          .update-resource-ram-row{outline:none !important;}
          .update-resource-tooltip{
            position:absolute !important;
            z-index:50 !important;
            left:34px !important;
            top:20px !important;
            min-width:151px !important;
            padding:7px 9px 8px !important;
            display:flex !important;
            flex-direction:column !important;
            gap:3px !important;
            border:1px solid #39444d !important;
            border-radius:5px !important;
            background:#1d2329 !important;
            box-shadow:0 5px 14px rgba(0,0,0,.34) !important;
            color:#e7edf2 !important;
            font-size:10.5px !important;
            line-height:1.2 !important;
            white-space:nowrap !important;
            pointer-events:none !important;
            opacity:0 !important;
            visibility:hidden !important;
            transform:translateY(2px) !important;
            transition:opacity .1s ease,transform .1s ease,visibility .1s ease !important;
          }
          .update-resource-tooltip strong{
            color:#f0f4f7 !important;
            font-size:11px !important;
            font-weight:700 !important;
          }
          .update-resource-tooltip[hidden]{display:none !important;}
          .update-resource-ram-row:hover .update-resource-tooltip,
          .update-resource-ram-row:focus .update-resource-tooltip,
          .update-resource-ram-row:focus-within .update-resource-tooltip{
            opacity:1 !important;
            visibility:visible !important;
            transform:translateY(0) !important;
          }

          /* Port / network: connector icon beside heading, reserved two-line body. */
          .update-card-summary > .update-card-stats > .update-card-stat-port{
            --status-band-icon:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%224%22%20y%3D%225%22%20width%3D%2216%22%20height%3D%2214%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M8%205v5h8V5M8%2014h2m2%200h2m2%200h1%22%2F%3E%3C%2Fsvg%3E") !important;
            display:flex !important;
            flex-direction:column !important;
            justify-content:flex-start !important;
            padding:9px 7px 7px 36px !important;
            overflow:hidden !important;
            text-align:left !important;
            contain:layout paint !important;
          }
          .update-card-summary > .update-card-stats > .update-card-stat-port::before{
            left:8px !important;
            top:10px !important;
            width:22px !important;
            height:22px !important;
            transform:none !important;
            background:#69adff !important;
          }
          .update-card-stat-port .update-card-stat-label{
            width:100% !important;
            margin:0 0 7px !important;
            padding:0 !important;
            text-align:left !important;
            white-space:nowrap !important;
          }
          .update-card-stat-port .update-card-stat-value{
            width:100% !important;
            min-width:0 !important;
            min-height:28px !important;
            margin:0 !important;
            padding:0 !important;
            text-align:left !important;
            overflow:hidden !important;
          }
          .update-port-stat{
            display:flex !important;
            flex-direction:column !important;
            justify-content:flex-start !important;
            gap:1px !important;
            min-height:28px !important;
            max-width:100% !important;
            line-height:1.05 !important;
          }
          .update-port-line{
            display:block !important;
            min-width:0 !important;
            min-height:12px !important;
            max-width:100% !important;
            overflow:hidden !important;
            text-overflow:ellipsis !important;
            white-space:nowrap !important;
          }
          </style>'''

          index, count = style_pattern.subn(style_replacement, index, count=1)
          if count != 1:
              raise SystemExit(f'card style patch count={count}, expected 1')

          # Self update browser recovery: detect either a changed backend start time
          # OR the new backend version. The version check handles very fast restarts
          # where the browser never observes an offline interval.
          self_pattern = re.compile(
              r'async function waitForSelfUpdateRestart\(stackKey,previousStartedAt,timeoutMs=6\*60\*1000\)\{.*?\n\}\n\nasync function installImageUpdate',
              re.S,
          )
          self_replacement = r'''async function waitForSelfUpdateRestart(stackKey,previousStartedAt,timeoutMs=6*60*1000){
            const key=String(stackKey||'');
            if(!key)return false;
            const previous=String(previousStartedAt||'');
            const previousVersion=String(UPDATE_MONITOR_VERSION||'').replace(/^v/i,'');
            const deadline=Date.now()+Math.max(30000,Number(timeoutMs)||0);
            let sawOffline=false;

            while(Date.now()<deadline){
              let d=null;
              try{
                const separator=window.location.pathname.endsWith('/')?'':'/';
                const response=await fetch(`${window.location.pathname}${separator}api/status?_self_reload=${Date.now()}`,{
                  method:'GET',
                  credentials:'same-origin',
                  cache:'no-store',
                  headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}
                });
                if(response.ok)d=await response.json();
              }catch(_error){
                d=null;
              }

              if(!d){
                sawOffline=true;
                await new Promise(resolve=>setTimeout(resolve,1000));
                continue;
              }

              const startedAt=String(d&&d.service_runtime&&d.service_runtime.started_at||'');
              const backendVersion=String(d&&d.version||'').replace(/^v/i,'');
              const restarted=!!(
                (backendVersion&&previousVersion&&backendVersion!==previousVersion)
                ||(previous&&startedAt&&startedAt!==previous)
                ||(!previous&&sawOffline&&startedAt)
              );
              if(restarted)return true;

              await new Promise(resolve=>setTimeout(resolve,1000));
            }

            return false;
          }

          async function installImageUpdate'''
          index, count = self_pattern.subn(self_replacement, index, count=1)
          if count != 1:
              raise SystemExit(f'self update watcher patch count={count}, expected 1')

          old_reload = "window.setTimeout(()=>window.location.reload(),700);"
          new_reload = """window.setTimeout(()=>{\n        const reloadUrl=new URL(window.location.href);\n        reloadUrl.searchParams.set('_um_reload',String(Date.now()));\n        window.location.replace(reloadUrl.toString());\n      },700);"""
          if old_reload not in index:
              raise SystemExit('self update reload call not found')
          index = index.replace(old_reload, new_reload, 1)

          # Version bump everywhere the current source embeds it.
          if OLD_VERSION not in index:
              raise SystemExit(f'{OLD_VERSION} not found in index.html')
          index = index.replace(OLD_VERSION, NEW_VERSION)

          old_main = f'VERSION = "{OLD_VERSION}"'
          new_main = f'VERSION = "{NEW_VERSION}"'
          if old_main not in main:
              raise SystemExit(f'{old_main} not found in app/main.py')
          main = main.replace(old_main, new_main, 1)

          index_path.write_text(index, encoding='utf-8')
          main_path.write_text(main, encoding='utf-8')

          if readme_path.exists():
              readme = readme_path.read_text(encoding='utf-8')
              readme = readme.replace(f'Current release: **v{OLD_VERSION}**', f'Current release: **v{NEW_VERSION}**')
              readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate v0.3.335
        shell: bash
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert '0.3.335' in html
          assert 'um-card-resource-port-v0335' in html
          assert 'grid-template-columns:34px minmax(0,1fr)' in html
          assert '.update-resource-percent{' in html and 'display:none !important' in html
          assert "backendVersion!==previousVersion" in html
          assert "searchParams.set('_um_reload'" in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          Path('/tmp/update-monitor.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/update-monitor.js
          git diff --check

      - name: Commit patched sources and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v0335-final-card-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Finalize CPU RAM card layout and self update reload v0.3.335"
          git push origin HEAD:main
