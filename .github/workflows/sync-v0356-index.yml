name: Validate and synchronize release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate backend syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py

      - name: Synchronize large frontend safely
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_frontend.py

      - name: Validate async update bridge syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          from pathlib import Path

          source = Path("app/main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          bridges = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id in {
                      "_INDEX_ASYNC_UPDATE_BRIDGE",
                      "_INDEX_WEBHOOK_AUTOMATION_BRIDGE",
                  }:
                      bridges[target.id] = ast.literal_eval(node.value)

          async_bridge = bridges.get("_INDEX_ASYNC_UPDATE_BRIDGE")
          webhook_bridge = bridges.get("_INDEX_WEBHOOK_AUTOMATION_BRIDGE")
          assert isinstance(async_bridge, str)
          assert isinstance(webhook_bridge, str)
          assert '<script id="um-async-update-bridge-v0366">' in async_bridge
          assert '<script id="um-webhook-automation-v0370">' in webhook_bridge

          Path("/tmp/um-async-update-bridge.js").write_text(
              async_bridge.split(">", 1)[1].rsplit("</script>", 1)[0],
              encoding="utf-8",
          )
          Path("/tmp/um-webhook-automation.js").write_text(
              webhook_bridge.split(">", 1)[1].rsplit("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/um-async-update-bridge.js
          node --check /tmp/um-webhook-automation.js

      - name: Run release regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          import re
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          html = Path("static/index.html").read_text(encoding="utf-8")
          version_match = re.search(r'^VERSION = "([^"]+)"', main, re.MULTILINE)
          assert version_match
          release_version = version_match.group(1)

          tree = ast.parse(main)

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          def function_source(name):
              node = functions[name]
              return ast.get_source_segment(main, node) or ""

          def load_function(name, env):
              node = functions[name]
              module = ast.Module(body=[node], type_ignores=[])
              ast.fix_missing_locations(module)
              scope = dict(env)
              exec(compile(module, "<regression>", "exec"), scope)
              return scope[name], scope

          # Exact v0.3.360 helper: live Docker must beat a stale GHCR scan alias.
          def parse_image_ref(value):
              value = str(value or "").strip().split("@", 1)[0]
              slash = value.rfind("/")
              colon = value.rfind(":")
              if colon > slash:
                  repo, tag = value[:colon], value[colon + 1:]
              else:
                  repo, tag = value, "latest"
              return {"repo": repo, "tag": tag, "normalized_repo": repo}

          live = {"uptime-kuma": "louislam/uptime-kuma:2.5.4"}
          target_fn, _ = load_function(
              "_update_target_ref_on_active_registry",
              {
                  "docker_container_config_image": lambda name: live.get(name),
                  "parse_image_ref": parse_image_ref,
              },
          )
          item = {
              "containers": [{"name": "uptime-kuma"}],
              "runtime_image_refs": ["ghcr.io/louislam/uptime-kuma:latest"],
              "image_ref": "ghcr.io/louislam/uptime-kuma:latest",
              "tracking_image_ref": "ghcr.io/louislam/uptime-kuma:latest",
          }
          assert target_fn(item, "2") == "louislam/uptime-kuma:2"
          assert target_fn(item, "2.5.5") == "louislam/uptime-kuma:2.5.5"
          assert target_fn(item) == "louislam/uptime-kuma:2.5.4"

          # Mixed Compose/runtime regression from Uptime Kuma:
          # Compose GHCR:2.5.4 + live Docker Hub:2 must be reconciled, not rejected.
          reconcile_fn, _ = load_function(
              "_update_channel_target_already_active",
              {
                  "image_ref_matches_target": lambda current, target: current == target,
              },
          )
          assert reconcile_fn(
              "ghcr.io/louislam/uptime-kuma:2.5.4",
              "louislam/uptime-kuma:2",
              "louislam/uptime-kuma:2",
          ) is False
          assert reconcile_fn(
              "louislam/uptime-kuma:2",
              "louislam/uptime-kuma:2",
              "louislam/uptime-kuma:2",
          ) is True

          # Numeric moving-channel regression: :2 is not a fixed version.
          needs_fn, needs_scope = load_function(
              "_needs_installed_version_resolution",
              {
                  "re": re,
                  "_DYNAMIC_REGISTRY_TAGS": {"latest", "stable"},
                  "_is_update_channel_tag": lambda value: (
                      str(value or "").lower() in {"latest", "stable"}
                      or bool(re.fullmatch(r"\d+", str(value or "")))
                  ),
              },
          )
          assert needs_fn("2") is True
          assert needs_fn("latest") is True
          assert needs_fn("2.5.5") is False

          reusable_fn, _ = load_function(
              "_installed_version_resolution_reusable",
              {
                  "_needs_installed_version_resolution": needs_fn,
              },
          )
          assert reusable_fn(
              {
                  "resolved_installed_tag": "2.5.4",
                  "installed_version_resolution": {"source": "previous-scan"},
              },
              "2",
          ) is False
          assert reusable_fn(
              {
                  "resolved_installed_tag": "2.5.4",
                  "installed_version_resolution": {"source": "configured-tag"},
              },
              "2",
          ) is False
          assert reusable_fn(
              {
                  "resolved_installed_tag": "2.5.5",
                  "installed_version_resolution": {"source": "registry-digest"},
              },
              "2",
          ) is True

          # Same-tag update regression: a fresh 2.5.5 digest must replace a stale 2.5.4 display.
          hint_fn, _ = load_function(
              "_pulled_image_version_hint",
              {
                  "parse_image_ref": parse_image_ref,
                  "parse_version": lambda value: (
                      {"tag": value} if re.fullmatch(r"\d+\.\d+(?:\.\d+)?", str(value or "")) else None
                  ),
                  "resolve_installed_version_tag": lambda repo, digests, candidates, platform, **kwargs: (
                      "2.5.5"
                      if repo == "louislam/uptime-kuma"
                      and "sha256:new255" in digests
                      and "2.5.5" in candidates
                      else None
                  ),
              },
          )
          assert hint_fn(
              {
                  "resolved_available_tag": "2.5.5",
                  "newer_tag": "2.5.5",
                  "available_version_tags": ["2.5.5", "2.5.4"],
              },
              {
                  "image_ref": "louislam/uptime-kuma:2",
                  "repo": "louislam/uptime-kuma",
                  "local_digests": ["sha256:new255"],
              },
              "linux/amd64",
          ) == "2.5.5"

          # Exact follow-policy helper: channel 2 must survive and legacy :2 must recover.
          channel_fn, _ = load_function(
              "_follow_policy_tag",
              {
                  "FOLLOW_POLICY_TAG": "latest",
                  "_is_update_channel_tag": lambda value: (
                      str(value or "").lower()
                      in {"latest", "stable", "lts", "next", "edge"}
                      or bool(re.fullmatch(r"\d+", str(value or "")))
                  ),
              },
          )
          assert channel_fn({"target_tag": "2"}, ["2.5.4"]) == "2"
          assert channel_fn({"target_tag": None}, ["2"]) == "2"
          assert channel_fn({"target_tag": None}, ["2.5.4"]) == "latest"

          # Exact acknowledgement helper: clear display error, preserve retry history.
          class Lock:
              def __enter__(self):
                  return self
              def __exit__(self, exc_type, exc, tb):
                  return False

          policies = {
              "uptime-kuma": {
                  "last_auto_result": "error",
                  "last_auto_error": "old GHCR pull failed",
                  "last_auto_signature": "version:follow:2.5.4->2",
              }
          }
          ack_fn, ack_scope = load_function(
              "acknowledge_auto_update_error",
              {
                  "policies": policies,
                  "policies_lock": Lock(),
                  "utc_now": lambda: "2026-09-19T13:00:00+00:00",
                  "save_json": lambda *args, **kwargs: None,
                  "POLICY_FILE": object(),
              },
          )
          assert ack_fn("uptime-kuma") is True
          assert policies["uptime-kuma"]["last_auto_error"] is None
          assert policies["uptime-kuma"]["last_auto_result"] == "error"
          assert policies["uptime-kuma"]["last_auto_signature"] == "version:follow:2.5.4->2"

          enrich_versions = function_source("enrich_scan_installed_versions")
          assert "_installed_version_resolution_reusable(item, current_tag)" in enrich_versions
          assert 'item["resolved_installed_tag"] = None' in enrich_versions

          image_update = function_source("perform_image_update")
          assert "_pulled_image_version_hint(" in image_update
          assert 'pulled["resolved_version_hint"] = version_hint' in image_update

          channel_switch = function_source("perform_image_channel_switch")
          assert re.search(
              r'save_monitor_policy\(\s*stack_key,\s*"follow",\s*target_tag,',
              channel_switch,
          )
          assert "_update_channel_target_already_active(" in channel_switch
          assert "compose_ref or current_ref" in channel_switch

          version_update = function_source("perform_version_update")
          assert "_follow_policy_tag(" in version_update
          assert ': target_tag' in version_update

          app_scan = function_source("app_scan")
          assert "acknowledge_auto_update_error(stack_key)" in app_scan

          backup_source = function_source("create_pre_update_backup")
          backup_runner = function_source("_run_backup_process_cancellable")
          assert "_run_backup_process_cancellable(" in backup_source
          assert "progress_callback=report_copy_progress" in backup_source
          assert "_backup_local_path_size_bytes(target_path)" in backup_source
          assert "elapsed / (elapsed + 4.0)" in backup_source
          assert "progress_callback=None" in backup_runner
          assert "progress_callback()" in backup_runner
          assert "except BackupCancelledError" in backup_source
          assert "shutil.rmtree(work_dir, ignore_errors=True)" in backup_source
          assert "work_dir.replace(final_dir)" in backup_source
          backup_cancel = function_source("backup_cancel")
          assert "request_backup_cancellation(data.stack_key)" in backup_cancel
          app_update = function_source("app_update")
          manual_update_worker = function_source("_manual_app_update_worker")
          assert "threading.Thread(" in app_update
          assert '"accepted": True' in app_update
          assert "except BackupCancelledError" in manual_update_worker
          assert "finish_action_progress_cancelled(stack_key)" in manual_update_worker
          assert "schedule_app_scan(" in manual_update_worker
          auto_update = function_source("run_due_auto_updates")
          assert 'current["last_auto_result"] = "cancelled"' in auto_update
          assert "if not cancelled:" in auto_update
          assert "/api/backup-cancel" in html
          assert "data-backup-cancel-inline" in html
          assert "backupCancelInline" in html
          assert "data-backup-cancel-stack" not in html
          assert "backup-cancel-running-button" not in html
          assert "backup_cancel_available" in html
          assert "backupCancelled" in html
          assert "cancelImageSourceBackup" in html
          assert "um-async-update-bridge-v0366" in html
          assert "result.accepted===true" in html
          assert "waitForAcceptedUpdate" in html
          assert "phase.startsWith('backup')" in html
          assert '100, determinate=True, phase="backup_done"' in backup_source
          assert "time.sleep(1.75)" in manual_update_worker
          assert "backupProgressVisuals" in html
          assert "smoothConfirmedBackupProgress" in html
          assert "requestAnimationFrame" in html

          webhook_receiver = function_source("github_webhook_receiver")
          webhook_sync = function_source("sync_github_webhooks")
          webhook_configure = function_source("github_webhook_configure")
          assert "X-Hub-Signature-256" in webhook_receiver
          assert "hmac.compare_digest" in webhook_receiver
          assert 'event != "package"' in webhook_receiver
          assert 'action != "published"' in webhook_receiver
          assert "schedule_app_scan(" in webhook_receiver
          assert '"events": ["package"]' in webhook_sync
          assert "hooks?per_page=100" in webhook_sync
          assert "github_webhook_callback_url" in webhook_configure
          webhook_permission_fallback = function_source("_github_webhook_permission_fallback")
          assert "X-RateLimit-Remaining" in webhook_permission_fallback
          assert "resource not accessible by personal access token" in webhook_permission_fallback
          assert "registry_fallback_permission" in webhook_sync
          assert "permission_fallback_repositories" in function_source("github_webhook_public_status")
          assert "um-webhook-automation-v0370" in html
          assert "/api/webhooks/configure" in html
          assert "/api/webhooks/sync" in html
          assert "Registry Prüfung" in html
          assert "ohne Webhook Berechtigung" in html

          # Frontend/release regression: all active version markers must agree.
          assert f"const UPDATE_MONITOR_VERSION = 'v{release_version}';" in html
          assert f'id="systemInfoVersion">v{release_version}</div>' in html
          compose = Path("docker-compose.zimaos.yml").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          manifest = Path("static/site.webmanifest").read_text(encoding="utf-8")
          channel_js = Path("static/update-channel.js").read_text(encoding="utf-8")
          audit = Path("translation-audit-current.json").read_text(encoding="utf-8")
          assert f'version: "{release_version}"' in compose
          assert f"Current release: **v{release_version}**" in readme
          assert release_version in manifest
          patch = release_version.rsplit(".", 1)[-1]
          assert f"um-update-channel-v0{patch}" in channel_js
          assert f'"version": "v{release_version}"' in audit
          assert "const storedAutoError=(\n    !isChecking\n    &&policy.auto_enabled" in html

          print(f"v{release_version} regression checks passed")
          PY

      - name: Commit synchronized frontend
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- static/index.html; then
            echo "static/index.html is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html
          git commit -m "Synchronize static UI for current release"
          git push
