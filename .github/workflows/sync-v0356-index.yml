name: Validate and synchronize release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate backend syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/main.py

      - name: Synchronize large frontend safely
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', main, re.MULTILINE)
          if not match:
              raise SystemExit("Backend VERSION marker not found")
          target = match.group(1)

          path = Path("static/index.html")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'(\?v=)\d+\.\d+\.\d+',
              lambda m: m.group(1) + target,
              text,
          )
          text = re.sub(
              r'(<div class="system-info-value" id="systemInfoVersion">v)\d+\.\d+\.\d+(</div>)',
              lambda m: m.group(1) + target + m.group(2),
              text,
          )
          text = re.sub(
              r'(/update-channel\.js\?v=)\d+\.\d+\.\d+',
              lambda m: m.group(1) + target,
              text,
          )
          text = re.sub(
              r"(const UPDATE_MONITOR_VERSION = 'v)\d+\.\d+\.\d+(';)",
              lambda m: m.group(1) + target + m.group(2),
              text,
          )

          old = """  const storedAutoError=(
              policy.auto_enabled
              &&policy.last_auto_result==='error'
              &&String(policy.last_auto_error||'').trim()
