              !isChecking
              &&policy.auto_enabled
              &&policy.last_auto_result==='error'
              &&String(policy.last_auto_error||'').trim()
          """
          if new not in text:
              if old not in text:
                  raise SystemExit("storedAutoError frontend block not found")
              text = text.replace(old, new, 1)


